syntax = "proto3";

package dws.schemacache.v2;

option go_package = "github.com/DingTalk-Real-AI/dingtalk-workspace-cli/internal/cli/schemacachepb;schemacachepb";

enum DTOVersion {
  DTO_VERSION_UNSPECIFIED = 0;
  DTO_VERSION_V1 = 1; // Recognized only so readers can explicitly reject retired DTOs.
  DTO_VERSION_V2 = 2; // Recognized only so readers can explicitly reject retired DTOs.
  DTO_VERSION_V3 = 3; // Recognized only so readers can explicitly reject retired DTOs.
  DTO_VERSION_V4 = 4; // Recognized only so readers can explicitly reject retired DTOs.
  DTO_VERSION_V5 = 5;
}

enum OverviewSummaryKind {
  OVERVIEW_SUMMARY_KIND_UNSPECIFIED = 0;
  OVERVIEW_SUMMARY_KIND_AGENT_SUMMARY = 1;
  OVERVIEW_SUMMARY_KIND_USE_WHEN = 2;
  OVERVIEW_SUMMARY_KIND_DESCRIPTION = 3;
}

enum ResultOutcome {
  RESULT_OUTCOME_UNSPECIFIED = 0;
  RESULT_OUTCOME_SUCCESS = 1;
  RESULT_OUTCOME_PENDING = 2;
  RESULT_OUTCOME_PARTIAL_FAILURE = 3;
  RESULT_OUTCOME_FAILURE = 4;
}

enum ExampleDispositionMode {
  EXAMPLE_DISPOSITION_MODE_UNSPECIFIED = 0;
  EXAMPLE_DISPOSITION_MODE_CONTRACT = 1;
  EXAMPLE_DISPOSITION_MODE_DRY_RUN = 2;
  EXAMPLE_DISPOSITION_MODE_CONTRACT_ONLY = 3;
}

enum ExampleDispositionReasonCode {
  EXAMPLE_DISPOSITION_REASON_CODE_UNSPECIFIED = 0;
  EXAMPLE_DISPOSITION_REASON_CODE_LOCAL_STATE = 1;
  EXAMPLE_DISPOSITION_REASON_CODE_STATEFUL_PREFLIGHT = 2;
}

message StringList { repeated string items = 1; }
message BytesValue { bytes value = 1; }
message BoolValue { bool value = 1; }
message IntValue { int64 value = 1; }
message StringListList { repeated StringList items = 1; }

message SchemaMetaCache {
  DTOVersion dto_version = 1;
  RegistryFields registry = 2;
  reserved 3;
  reserved "command_entries";
  SchemaOverviewCache overview = 4;
  LocatorEntryList locators = 5;
  ProductDescriptorList product_descriptors = 6;
  uint64 registry_data_length = 7;
  bytes registry_data_sha256 = 8;
  bytes source_sha256 = 9;
  bytes surface_sha256 = 10;
  CommandPayloadDescriptorList command_payload_descriptors = 11;
  uint64 payload_data_length = 12;
  bytes payload_sha256 = 13;
  // Per-product command entry shards, sorted by product_id. Each entries blob
  // is a serialized CommandMetaEntryList sorted by lookup_path. Keeping the
  // rows as opaque bytes lets meta decode skip all of them; a lookup decodes
  // only its own product's shard.
  CommandMetaEntryShardList command_entry_shards = 14;
}

message SchemaProductCache {
  DTOVersion dto_version = 1;
  RegistryFields registry = 2;
  ProductSpec product = 3;
}

message RegistryFields {
  string kind = 1;
  string level = 2;
  string source = 3;
  BytesValue agent_metadata = 4;
}

message CommandMetaEntryList { repeated CommandMetaEntry items = 1; }
// One product's command entries held as a serialized CommandMetaEntryList so
// meta stays a thin index and single-command lookups decode only their own
// product's rows.
message CommandMetaEntryShard {
  string product_id = 1;
  bytes entries = 2;
  // Row count in the entries blob; lets readers validate a product's command
  // cardinality without decoding the blob.
  uint64 entry_count = 3;
}
message CommandMetaEntryShardList { repeated CommandMetaEntryShard items = 1; }
// DTO v4 splits the Meta into an Identity-only index and a separate per-product
// command payload file, so validating every row no longer decodes Safety or
// Selection, and a single-command read pulls only its own product's payload.
// The payload file is deliberately independent of the registry so a corrupted
// registry cannot affect ResolveMeta. Retired fields stay reserved.
message CommandSelectionPayload {
  string agent_summary = 1;
  repeated string use_when = 2;
  repeated string avoid_when = 3;
  repeated string prerequisites = 4;
  repeated string tips = 5;
  repeated string examples = 6;
  // Bits 0..4 correspond to the five lists above. A set bit distinguishes
  // present-empty from nil; nonempty lists require their bit. Other bits fail.
  uint32 lists_present = 7;
}
message CommandMetaEntry {
  string lookup_path = 1;
  reserved 2;
  reserved "meta";
  string cli_path = 3;
  string canonical = 4;
  string product_id = 5;
  string title = 6;
  reserved 7, 8, 9, 10, 11, 19;
  reserved "effect", "risk", "confirmation", "idempotency", "agent_summary", "selection";
  repeated string aliases = 12;
  reserved 13, 14, 15, 16, 17;
  reserved "use_when", "avoid_when", "prerequisites", "tips", "examples";
  // Bit 0 marks aliases present-empty versus nil. Other bits fail.
  uint32 lists_present = 18;
}
// One command's Safety and Selection, held in its product's payload shard.
message CommandPayloadEntry {
  string lookup_path = 1;
  string effect = 2;
  string risk = 3;
  string confirmation = 4;
  string idempotency = 5;
  CommandSelectionPayload selection = 6;
}
message CommandPayloadEntryList { repeated CommandPayloadEntry items = 1; }
// One canonical command's rendered compact leaf descriptor. The leaf bytes
// live in the shard's raw blob region right after the header, so a leaf query
// reads only the small header and its own blob instead of the whole shard.
// offset/length address the blob region (0 = first byte after the header).
message RenderedSchemaLeafRef {
  string canonical_path = 1;
  uint64 offset = 2;
  uint64 length = 3;
  bytes sha256 = 4;
}
message RenderedSchemaLeafRefList { repeated RenderedSchemaLeafRef items = 1; }
// A product's command payload shard on disk is the 4-byte big-endian header
// length, then this message (the header), then the concatenated rendered leaf
// blobs addressed by rendered_leaf_index. The descriptor's header_sha256
// authenticates the length prefix and header bytes; each ref's sha256
// authenticates its own blob.
message SchemaCommandPayloadCache {
  DTOVersion dto_version = 1;
  string product_id = 2;
  CommandPayloadEntryList entries = 3;
  // Field 4 carried inline rendered leaf bytes in the unreleased v5 draft;
  // it now carries the leaf index. Never shipped to a release branch.
  RenderedSchemaLeafRefList rendered_leaf_index = 4;
}
message CommandPayloadDescriptor {
  string product_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
  bytes sha256 = 4;
  // header_length covers the 4-byte length prefix plus the header proto bytes;
  // header_sha256 authenticates exactly that prefix region for header-only reads.
  uint64 header_length = 5;
  bytes header_sha256 = 6;
}
message CommandPayloadDescriptorList { repeated CommandPayloadDescriptor items = 1; }

message SchemaOverviewCache {
  RegistryFields registry = 1;
  OverviewProductList products = 2;
  uint64 tool_count = 3;
}
message OverviewProductList { repeated OverviewProduct items = 1; }
message OverviewProduct {
  string id = 1;
  uint64 tool_count = 2;
  string schema_path = 3;
  OverviewSummaryKind summary_kind = 4;
  string summary = 5;
}

message LocatorEntryList { repeated LocatorEntry items = 1; }
message LocatorEntry {
  string lookup_path = 1;
  string product_id = 2;
}

message ProductDescriptorList { repeated ProductDescriptor items = 1; }
message ProductDescriptor {
  string product_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
  bytes sha256 = 4;
}

message ProductSpec {
  string id = 1;
  string name = 2;
  string description = 3;
  bool runtime = 4;
  ToolList tools = 5;
  Selection selection = 6;
  ProvenanceList field_provenance = 7;
}

message ToolList { repeated ToolSpec items = 1; }
message ToolSpec {
  ToolIdentity identity = 1;
  string display = 2;
  string title = 3;
  string description = 4;
  string metadata_source = 5;
  ParameterList parameters = 6;
  Constraints constraints = 7;
  PositionalList positionals = 8;
  DryRun dry_run = 9;
  Result result = 10;
  Pagination pagination = 11;
  Safety safety = 12;
  Interface interface = 13;
  Selection selection = 14;
  ProvenanceList field_provenance = 15;
}

message ParameterList { repeated ParameterSpec items = 1; }
message ParameterSpec {
  string name = 1;
  string type = 2;
  string description = 3;
  string property = 4;
  bool required = 5;
  bool cli_required = 6;
  string required_when = 7;
  BytesValue default_value = 8;
  BytesValue interface_default = 9;
  BytesValue example = 10;
  string format = 11;
  StringList enum = 12;
  string interface_description = 13;
  string interface_type = 14;
  ProvenanceList field_provenance = 15;
}

message ToolIdentity {
  string product_id = 1;
  string source_product_id = 2;
  string name = 3;
  string cli_name = 4;
  string canonical_path = 5;
  string path = 6;
  string cli_path = 7;
  string primary_cli_path = 8;
  string group = 9;
  StringList aliases = 10;
  bool is_alias = 11;
  string source = 12;
}

message Constraints {
  StringListList mutually_exclusive = 1;
  StringListList require_one_of = 2;
  StringListList require_together = 3;
}

message PositionalList { repeated Positional items = 1; }
message Positional {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
  bool variadic = 5;
  int64 index = 6;
}

message DryRun {
  string preview_kind = 1;
  bool remote_reads = 2;
}

message Result {
  ResultOutcomeList outcomes = 1;
  BytesValue data_schema = 2;
  StringList sensitive_paths = 3;
}
message ResultOutcomeList { repeated ResultOutcome items = 1; }

message Pagination {
  string kind = 1;
  string cursor_parameter = 2;
  string meta_path = 3;
  string endpoint_exhausted_path = 4;
  string next_token_path = 5;
}

message Safety {
  string effect = 1;
  string effect_source = 2;
  string risk = 3;
  string confirmation = 4;
  string idempotency = 5;
}

message Interface {
  InterfaceRef ref = 1;
  string mode = 2;
  string availability = 3;
  string reason = 4;
}
message InterfaceRef {
  string product_id = 1;
  string rpc_name = 2;
}

message Selection {
  string agent_summary = 1;
  string agent_summary_source = 2;
  StringList use_when = 3;
  StringList avoid_when = 4;
  StringList prerequisites = 5;
  StringList tips = 6;
  StringList workflow_refs = 7;
  StringList examples = 8;
  ExampleDispositionList example_dispositions = 9;
  BoolValue reviewed = 10;
  StringList source_refs = 11;
  string metadata_source = 12;
}

message ExampleDispositionList { repeated ExampleDisposition items = 1; }
message ExampleDisposition {
  IntValue index = 1;
  ExampleDispositionMode mode = 2;
  ExampleDispositionReasonCode reason_code = 3;
  string reason = 4;
  bool reviewed = 5;
}

message ProvenanceList { repeated ProvenanceEntry items = 1; }
message ProvenanceEntry {
  string key = 1;
  FieldProvenance value = 2;
}
message FieldProvenance {
  BytesValue value = 1;
  string source = 2;
  string source_ref = 3;
  string precedence = 4;
  string resolution = 5;
  string review_reason = 6;
  CandidateList candidates = 7;
  CandidateList overridden_candidates = 8;
}
message CandidateList { repeated FieldCandidate items = 1; }
message FieldCandidate {
  BytesValue value = 1;
  string source = 2;
  string source_ref = 3;
  string precedence = 4;
  string review_reason = 5;
  BoolValue selected = 6;
}
