# Issue 自动同步到钉钉群
# 当有新 Issue 时，自动发送到钉钉群（不包括 comment）
name: 🔔 Issue Notification to DingTalk

on:
  issues:
    types: [opened, reopened, closed, labeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📬 Send Issue to DingTalk
        uses: actions/github-script@v7
        with:
          script: |
            const webhooks = [
              process.env.DINGTALK_WEBHOOK,
              process.env.DINGTALK_WEBHOOK_SECONDARY
            ].filter(Boolean);
            if (webhooks.length === 0) {
              console.log('⚠️ No DingTalk webhook configured, skipping notification');
              return;
            }
            
            const payload = context.payload;
            const issue = payload.issue;
            const action = payload.action;
            
            // 构建消息标题和内容（确保包含关键字 "issue" 以支持 Custom Keywords 模式）
            const title = `[${action.toUpperCase()}] Issue #${issue.number}: ${issue.title}`;
            const content = issue.body?.substring(0, 500) || 'No description';
            const url = issue.html_url;
            const labelsText = (issue.labels || []).map(label => label.name).join(', ') || '无标签';
            
            // 消息内容必须包含关键字（如 "issue"）以支持 Custom Keywords 安全模式
            const message = {
              msgtype: 'markdown',
              markdown: {
                title: 'GitHub Issue 通知',
                text: `## 🔔 GitHub Issue 通知\n\n**${title}**\n\n🏷️ **Labels**: ${labelsText}\n\n${content}${content.length >= 500 ? '...' : ''}\n\n[点击查看详情](${url})\n\n---\n📦 ${context.repo.owner}/${context.repo.repo}\n\n**关键词**: issue`
              }
            };
            
            await Promise.all(webhooks.map(webhook =>
              fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(message)
              })
            ));
            
            console.log(`✅ DingTalk notification sent to ${webhooks.length} webhook(s)`);
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_WEBHOOK_SECONDARY: ${{ secrets.DINGTALK_WEBHOOK_SECONDARY }}
