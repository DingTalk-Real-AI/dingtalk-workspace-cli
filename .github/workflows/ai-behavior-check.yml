name: Code Admission — AI Behavior

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # State transitions for one PR supersede older policy evaluations. This
  # prevents a stale Ready run from overwriting the fail-closed Draft status.
  group: ai-behavior-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  ai-behavior-check:
    name: AI Behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberately do not check out or execute pull-request code here.
      # pull_request_target keeps this policy anchored to the base branch.
      - name: Check pull request readiness
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const sha = context.eventName === 'push' ? context.sha : pullRequest.head.sha;
            const statusTargetUrl = context.eventName === 'push'
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`
              : `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}`;
            const setStatus = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'AI Behavior',
                description,
                target_url: statusTargetUrl,
              });

            await setStatus('pending', 'Evaluating pull request readiness');

            if (context.eventName === 'push') {
              await setStatus('success', 'Not applicable to the protected main push');
              core.notice('AI Behavior is a PR policy; the main push context is sealed.');
              return;
            }

            try {
              const expectedHead = pullRequest.head.sha;
              const expectedBase = pullRequest.base.sha;
              const expectedDraft = pullRequest.draft;
              const currentPull = async (phase) => {
                const { data: pull } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                });
                if (
                  pull.head.sha !== expectedHead ||
                  pull.base.sha !== expectedBase ||
                  pull.draft !== expectedDraft ||
                  pull.state !== 'open'
                ) {
                  throw new Error(
                    `Pull request identity changed during ${phase}: ` +
                    `expected base/head/draft/state ${expectedBase}/${expectedHead}/${expectedDraft}/open, ` +
                    `got ${pull.base.sha}/${pull.head.sha}/${pull.draft}/${pull.state}`
                  );
                }
                return pull;
              };

              const before = await currentPull('pre-admission check');
              if (before.draft) {
                await setStatus('failure', 'Draft PR; mark Ready to run Code Admission');
                core.setFailed(
                  'Draft pull requests are not eligible for Code Admission. ' +
                  'Mark the pull request ready to run all nine required contexts.'
                );
                return;
              }

              await currentPull('post-admission check');
              await setStatus('success', 'Ready PR; no AI-only restrictions');
              core.notice('Ready PR; the remaining Code Admission checks still apply.');
            } catch (error) {
              await setStatus('error', 'Could not evaluate the exact pull request revision');
              throw error;
            }
