name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Auto-merge metadata is governed by the base-owned Reviewer Router. It
    # does not change the head SHA, so it must not restart this full admission
    # graph or evict useful in-flight work for the same revision.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  # Keep only the latest revision of a pull request: a stale run must not
  # compete with its replacement for hosted runners. A replacement that sees
  # a cold baseline cache recomputes it authoritatively. Protected-main pushes
  # remain keyed by exact SHA so every potential merge base has a producer.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Draft revisions use the isolated Draft CI workflow. Skip the heavy
    # admission graph; the base-owned AI Behavior status fails Draft revisions
    # so these successful skipped checks cannot authorize a merge.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      changelog_only: ${{ steps.classify.outputs.changelog_only }}
      release_seal_only: ${{ steps.classify.outputs.release_seal_only }}
      changelog_changed: ${{ steps.classify.outputs.changelog_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_suite: ${{ steps.classify.outputs.full_suite }}
      release_sensitive: ${{ steps.classify.outputs.release_sensitive }}
      interface_sensitive: ${{ steps.classify.outputs.interface_sensitive }}
      mcp_sensitive: ${{ steps.classify.outputs.mcp_sensitive }}
      edition_sensitive: ${{ steps.classify.outputs.edition_sensitive }}
      platform_sensitive: ${{ steps.classify.outputs.platform_sensitive }}
      admitted_merge: ${{ steps.classify.outputs.admitted_merge }}
      admitted_merge_head_sha: ${{ steps.classify.outputs.admitted_merge_head_sha }}
      admitted_merge_run_id: ${{ steps.classify.outputs.admitted_merge_run_id }}
      admitted_merge_artifact_id: ${{ steps.classify.outputs.admitted_merge_artifact_id }}
      admitted_merge_artifact_digest: ${{ steps.classify.outputs.admitted_merge_artifact_digest }}
    steps:
      - name: Classify revision scope
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            let changelogOnly = false;
            let releaseSealOnly = false;
            let changelogChanged = false;
            let docsOnly = false;
            let fullSuite = context.eventName === 'push';
            let releaseSensitive = context.eventName === 'push';
            let interfaceSensitive = context.eventName === 'push';
            let mcpSensitive = context.eventName === 'push';
            let editionSensitive = context.eventName === 'push';
            let platformSensitive = context.eventName === 'push';
            let admittedMerge = false;
            let admittedMergeHeadSha = '';
            let admittedMergeRunId = '';
            let admittedMergeArtifactId = '';
            let admittedMergeArtifactDigest = '';
            let files = [];
            let fastPathTrust = 'not evaluated';
            const requiredContexts = [
              'Lint',
              'Test',
              'Coverage',
              'Policy',
              'Edition',
              'Interface Integrity',
              'AI Behavior',
              'CLI Smoke',
              'Mock MCP',
            ];

            const isDocsOnly = (filename) =>
              typeof filename === 'string' &&
              (
                filename === 'CHANGELOG.md' ||
                filename === 'README.md' ||
                filename === 'README_zh.md' ||
                filename === 'CONTRIBUTING.md' ||
                filename === 'SECURITY.md' ||
                filename === 'CODE_OF_CONDUCT.md' ||
                filename === 'LICENSE' ||
                filename === 'NOTICE' ||
                filename === '.github/PULL_REQUEST_TEMPLATE.md' ||
                filename.startsWith('.github/ISSUE_TEMPLATE/') ||
                filename.startsWith('docs/')
              );
            const isReleaseSensitive = (filename) =>
              typeof filename === 'string' &&
              (
                filename.startsWith('scripts/release/') ||
                filename.startsWith('scripts/install') ||
                filename.startsWith('Formula/') ||
                filename.startsWith('build/') ||
                filename.startsWith('third_party/runtimepayload/') ||
                filename === '.goreleaser.yaml' ||
                filename === '.github/workflows/release.yml' ||
                filename === '.github/workflows/withdraw-release.yml'
              );
            const isPlatformSensitive = (filename) =>
              typeof filename === 'string' &&
              (
                filename.startsWith('internal/auth/') ||
                filename.startsWith('internal/keychain/') ||
                filename.startsWith('internal/runtimecontext/') ||
                filename.startsWith('third_party/runtimepayload/') ||
                /_(darwin|windows|linux|unix)(?:_[a-z0-9]+)*\.go$/.test(filename) ||
                filename === '.github/workflows/ci.yml' ||
                filename ===
                  'scripts/policy/run-platform-coverage-gate.sh'
              );
            const isNativeGoChange = ({ filename, previous_filename, patch }) => {
              const paths = [filename, previous_filename].filter(
                (value) => typeof value === 'string' && value !== ''
              );
              if (paths.some(isPlatformSensitive)) {
                return true;
              }
              if (!paths.some((value) => value.endsWith('.go'))) {
                return false;
              }
              if (typeof patch !== 'string') {
                return true;
              }
              return (
                /\/\/go:build[^\n]*(darwin|windows|linux|unix)/.test(patch) ||
                /runtime\.GO(OS|ARCH)/.test(patch)
              );
            };
            const isInterfaceSensitive = (filename) =>
              typeof filename === 'string' &&
              (
                filename.startsWith('cmd/') ||
                filename.startsWith('internal/app/') ||
                filename.startsWith('internal/cli/') ||
                filename.startsWith('internal/cobracmd/') ||
                filename.startsWith('internal/corecmd/') ||
                filename.startsWith('internal/helpers/') ||
                filename.startsWith('internal/i18n/') ||
                filename.startsWith('internal/interfacesnapshot/') ||
                filename.startsWith('internal/ir/') ||
                filename.startsWith('internal/shortcut/') ||
                filename.startsWith('pkg/cmdutil/') ||
                filename === 'skills_embed.go' ||
                filename === 'test/fixtures/cli-interface-baseline.txt' ||
                filename.startsWith('skills/')
              );
            const isMCPSensitive = (filename) =>
              typeof filename === 'string' &&
              (
                filename.startsWith('internal/mcp') ||
                filename.startsWith('internal/transport/') ||
                filename.startsWith('internal/helpers/') ||
                filename.startsWith('internal/app/') ||
                filename.startsWith('test/mock_mcp/')
              );
            const isEditionSensitive = (filename) =>
              typeof filename === 'string' &&
              (
                filename.startsWith('pkg/edition') ||
                filename.startsWith('internal/edition') ||
                filename === 'go.mod' ||
                filename === 'go.sum'
              );
            const isHighRisk = (filename) =>
              typeof filename === 'string' &&
              (
                isPlatformSensitive(filename) ||
                isReleaseSensitive(filename) ||
                filename.startsWith('.github/workflows/') ||
                filename === '.github/actionlint.yaml' ||
                filename.startsWith('scripts/') ||
                filename.startsWith('verify/') ||
                filename.startsWith('internal/helpers/') ||
                // Shortcut declarations feed the live command tree and Schema
                // assembly. Their reverse dependencies include the expensive
                // app and generator packages, which must run in separate shards.
                filename.startsWith('internal/shortcut/') ||
                filename.startsWith('internal/generator/') ||
                filename.startsWith('internal/cli/schema') ||
                // Parameter aliases are reduced against the live command tree.
                // Their reverse-dependency set is too large for one focused
                // race job, so use the existing full-suite shards.
                filename === 'internal/cli/param_concepts.json' ||
                filename === 'internal/cli/param_concepts.schema.json' ||
                filename === 'internal/cli/param_aliases_generated.go' ||
                filename.startsWith('internal/interfacesnapshot/') ||
                filename.startsWith('internal/app/upgrade') ||
                filename.startsWith('internal/transport/') ||
                filename.startsWith('internal/syncdata/') ||
                filename.includes('/testdata/') ||
                filename.startsWith('testdata/') ||
                filename.startsWith('test/fixtures/') ||
                filename === 'Makefile' ||
                filename === 'go.mod' ||
                filename === 'go.sum'
              );
            const isExactReleaseSeal = (candidates) => {
              const changelog = candidates.filter(
                ({ filename, status, previous_filename }) =>
                  filename === 'CHANGELOG.md' &&
                  status === 'modified' &&
                  !previous_filename
              );
              if (changelog.length !== 1 || candidates.length < 2) {
                return false;
              }
              let version = '';
              return candidates.every((file) => {
                if (file.filename === 'CHANGELOG.md') {
                  return file.status === 'modified' && !file.previous_filename;
                }
                if (
                  file.status !== 'renamed' ||
                  typeof file.filename !== 'string' ||
                  typeof file.previous_filename !== 'string' ||
                  file.additions !== 0 ||
                  file.deletions !== 0
                ) {
                  return false;
                }
                const target = file.filename.match(
                  /^\.changes\/released\/([0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[1-9][0-9]*)?)\/([a-z0-9][a-z0-9._-]*\.md)$/
                );
                if (!target || file.previous_filename !== `.changes/${target[2]}`) {
                  return false;
                }
                if (version && version !== target[1]) {
                  return false;
                }
                version = target[1];
                return true;
              });
            };
            const classifyFiles = (complete) => {
              const paths = files.flatMap(({ filename, previous_filename }) =>
                [filename, previous_filename].filter(
                  (value) => typeof value === 'string' && value !== ''
                )
              );
              const structuralChange = files.some(
                ({ status, previous_filename }) =>
                  status === 'removed' || Boolean(previous_filename)
              );
              const goPackageShapeChange = files.some(
                ({ filename, previous_filename, status }) =>
                  ['added', 'removed'].includes(status) &&
                  [filename, previous_filename].some(
                    (value) =>
                      typeof value === 'string' && value.endsWith('.go')
                  )
              );
              docsOnly =
                complete &&
                files.length > 0 &&
                paths.length > 0 &&
                paths.every(isDocsOnly);
              releaseSensitive =
                !complete || paths.some(isReleaseSensitive);
              platformSensitive =
                !complete || files.some(isNativeGoChange);
              interfaceSensitive =
                !complete ||
                paths.some(isInterfaceSensitive) ||
                paths.some(isEditionSensitive);
              mcpSensitive =
                !complete || paths.some(isMCPSensitive);
              editionSensitive =
                !complete || paths.some(isEditionSensitive);
              fullSuite =
                !complete ||
                (
                  !docsOnly &&
                  (
                    context.eventName === 'push' ||
                    structuralChange ||
                    goPackageShapeChange ||
                    files.some(isNativeGoChange) ||
                    paths.some(isHighRisk)
                  )
                );
            };

            if (context.eventName === 'pull_request') {
              const expectedHead = context.payload.pull_request.head.sha;
              const expectedBase = context.payload.pull_request.base.sha;
              const assertCurrentRevision = async (phase) => {
                const { data: pull } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                });
                if (pull.head.sha !== expectedHead || pull.base.sha !== expectedBase) {
                  throw new Error(
                    `Pull request revision changed during ${phase}: ` +
                    `expected base/head ${expectedBase}/${expectedHead}, ` +
                    `got ${pull.base.sha}/${pull.head.sha}`
                  );
                }
                return pull;
              };

              const before = await assertCurrentRevision('pre-classification');
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              const after = await assertCurrentRevision('post-classification');
              if (
                before.changed_files !== files.length ||
                after.changed_files !== files.length
              ) {
                throw new Error(
                  `Pull request file list is incomplete: API reports ` +
                  `${after.changed_files} changed files, pagination returned ${files.length}`
                );
              }

              const exactChangelogDiff =
                files.length === 1 &&
                files[0].filename === 'CHANGELOG.md' &&
                files[0].status === 'modified' &&
                !files[0].previous_filename;
              releaseSealOnly = isExactReleaseSeal(files);
              changelogOnly = exactChangelogDiff || releaseSealOnly;
              changelogChanged = files.some(
                ({ filename, previous_filename }) =>
                  filename === 'CHANGELOG.md' ||
                  previous_filename === 'CHANGELOG.md'
              );
              classifyFiles(true);
              if (releaseSealOnly) {
                fullSuite = false;
              }
              fastPathTrust = changelogOnly
                ? releaseSealOnly
                  ? 'exact release-seal fragment archival and synthetic merge policy'
                  : 'exact CHANGELOG-only revision and synthetic merge policy'
                : docsOnly
                  ? 'documentation-only focused admission'
                  : fullSuite
                    ? 'high-risk full admission'
                    : 'changed-package focused admission';
            } else if (context.eventName === 'push') {
              const expectedBefore = context.payload.before;
              const expectedAfter = context.payload.after;
              const fullCommit = /^[0-9a-f]{40}$/;
              const zeroCommit = '0'.repeat(40);
              const requireFullMain = () => {
                changelogOnly = false;
                releaseSealOnly = false;
                docsOnly = false;
                fullSuite = true;
                releaseSensitive = true;
                interfaceSensitive = true;
                mcpSensitive = true;
                editionSensitive = true;
                platformSensitive = true;
              };

              if (
                context.ref !== 'refs/heads/main' ||
                context.payload.ref !== 'refs/heads/main' ||
                context.payload.created !== false ||
                context.payload.deleted !== false ||
                context.payload.forced !== false ||
                !fullCommit.test(expectedBefore || '') ||
                !fullCommit.test(expectedAfter || '') ||
                expectedBefore === zeroCommit ||
                expectedAfter === zeroCommit ||
                expectedAfter !== context.sha
              ) {
                fastPathTrust =
                  'push identity is not a non-forced update of the existing main branch';
              } else {
                let comparison = {
                  status: 'unknown',
                  merge_base_commit: null,
                  behind_by: 1,
                  ahead_by: 0,
                  total_commits: 0,
                  files: [],
                };
                let comparisonAvailable = false;
                try {
                  const response = await github.rest.repos.compareCommitsWithBasehead({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    basehead: `${expectedBefore}...${expectedAfter}`,
                    per_page: 100,
                  });
                  comparison = response.data;
                  comparisonAvailable = true;
                } catch (error) {
                  fastPathTrust =
                    `push comparison unavailable; full main suite required: ${error.message}`;
                  core.warning(fastPathTrust);
                }
                files = Array.isArray(comparison.files) ? comparison.files : [];
                const pushFilesComplete = files.length < 300;
                classifyFiles(pushFilesComplete);
                if (!comparisonAvailable) {
                  requireFullMain();
                }
                const linearFromValidatedTip =
                  comparison.status === 'ahead' &&
                  comparison.merge_base_commit?.sha === expectedBefore &&
                  comparison.behind_by === 0 &&
                  comparison.ahead_by > 0 &&
                  comparison.total_commits === comparison.ahead_by;
                const exactChangelogDiff =
                  files.length === 1 &&
                  files[0].filename === 'CHANGELOG.md' &&
                  files[0].status === 'modified' &&
                  !files[0].previous_filename;
                const exactReleaseSealDiff =
                  pushFilesComplete && isExactReleaseSeal(files);

                if (linearFromValidatedTip && (exactChangelogDiff || exactReleaseSealDiff)) {
                  try {
                    const runs = await github.paginate(
                      github.rest.checks.listForRef,
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: expectedBefore,
                        filter: 'latest',
                        per_page: 100,
                      }
                    );
                    const latestByName = new Map();
                    for (const run of runs) {
                      if (
                        run.head_sha !== expectedBefore ||
                        run.app?.slug !== 'github-actions' ||
                        !requiredContexts.includes(run.name)
                      ) {
                        continue;
                      }
                      const current = latestByName.get(run.name);
                      if (!current || run.id > current.id) {
                        latestByName.set(run.name, run);
                      }
                    }
                    const missing = requiredContexts.filter(
                      (name) => !latestByName.has(name)
                    );
                    const nonSuccess = requiredContexts.flatMap((name) => {
                      const run = latestByName.get(name);
                      if (!run || run.conclusion === 'success') {
                        return [];
                      }
                      return [
                        `${name}=${run.conclusion || run.status || 'unknown'}`,
                      ];
                    });

                    if (missing.length === 0 && nonSuccess.length === 0) {
                      changelogOnly = true;
                      releaseSealOnly = exactReleaseSealDiff;
                      changelogChanged = true;
                      if (releaseSealOnly) {
                        fullSuite = false;
                      }
                      fastPathTrust =
                        releaseSealOnly
                          ? `exact release-seal successor of validated ${expectedBefore}`
                          : `exact CHANGELOG-only successor of validated ${expectedBefore}`;
                    } else {
                      requireFullMain();
                      fastPathTrust =
                        'predecessor Code Admission is not fully successful; ' +
                        `missing=${missing.join(',') || 'none'}; ` +
                        `non-success=${nonSuccess.join(',') || 'none'}`;
                      core.warning(fastPathTrust);
                    }
                  } catch (error) {
                    requireFullMain();
                    fastPathTrust =
                      `predecessor admission unavailable; full main suite required: ` +
                      `${error.message}`;
                    core.warning(fastPathTrust);
                  }
                } else if (comparisonAvailable) {
                  fastPathTrust =
                    'push is not an exact linear CHANGELOG-only successor';
                }

                // A normal protected merge may produce a new commit SHA whose
                // tree is byte-for-byte the already admitted PR head. Reuse is
                // allowed only after binding the two-parent merge identity,
                // every required check, the exact run of the base-owned CI
                // definition, and its immutable coverage artifact. Any
                // uncertainty falls back to the complete protected-main suite.
                if (!changelogOnly && linearFromValidatedTip) {
                  try {
                    const {data: targetCommit} = await github.rest.repos.getCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: expectedAfter,
                      per_page: 100,
                    });
                    if (
                      targetCommit.sha !== expectedAfter ||
                      targetCommit.parents.length !== 2 ||
                      targetCommit.parents[0]?.sha !== expectedBefore ||
                      !fullCommit.test(targetCommit.parents[1]?.sha || '')
                    ) {
                      throw new Error('target is not an exact two-parent merge from push before');
                    }
                    const admittedHeadSha = targetCommit.parents[1].sha;
                    const matchesAdmittedMerge = (pull) =>
                      pull.state === 'closed' &&
                      typeof pull.merged_at === 'string' &&
                      pull.merged_at.length > 0 &&
                      pull.base?.ref === 'main' &&
                      pull.base?.sha === expectedBefore &&
                      pull.base?.repo?.full_name ===
                        'DingTalk-Real-AI/dingtalk-workspace-cli' &&
                      pull.merge_commit_sha === expectedAfter &&
                      pull.head?.sha === admittedHeadSha &&
                      typeof pull.head?.ref === 'string' &&
                      pull.head.ref.length > 0 &&
                      typeof pull.head?.repo?.full_name === 'string' &&
                      pull.head.repo.full_name.length > 0;
                    const findAdmittedPulls = async () => {
                      const associatedPulls = await github.paginate(
                        github.rest.pulls.listPullRequestsAssociatedWithCommit,
                        {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          commit_sha: expectedAfter,
                          per_page: 100,
                        },
                      );
                      const matched = associatedPulls.filter(matchesAdmittedMerge);
                      if (matched.length > 0) {
                        return matched;
                      }
                      // A protected-main push fires within seconds of the
                      // merge, before the commit-to-PR association index
                      // necessarily lists the fresh merge commit. The merge
                      // transaction has already recorded merge_commit_sha on
                      // the PR itself, so the most recently updated closed
                      // PRs are a second discovery source under the identical
                      // exact filter. One page only: the just-merged PR is
                      // always among the latest updated closed main PRs.
                      try {
                        const {data: recentlyClosedPulls} =
                          await github.rest.pulls.list({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            state: 'closed',
                            base: 'main',
                            sort: 'updated',
                            direction: 'desc',
                            per_page: 100,
                          });
                        return (recentlyClosedPulls || []).filter(matchesAdmittedMerge);
                      } catch (error) {
                        core.warning(
                          `closed-PR fallback discovery failed: ${error.message}`,
                        );
                        return [];
                      }
                    };
                    // Bounded retry so discovery can wait out association-index
                    // lag instead of failing closed on the first snapshot.
                    // Only zero matches retry; ambiguity throws immediately.
                    const retryIntervalMs = Math.max(
                      0,
                      Number.parseInt(
                        process.env.DWS_ADMITTED_MERGE_RETRY_INTERVAL_MS || '5000',
                        10,
                      ) || 0,
                    );
                    const retryAttempts = Math.max(
                      1,
                      Number.parseInt(
                        process.env.DWS_ADMITTED_MERGE_RETRY_ATTEMPTS || '12',
                        10,
                      ) || 1,
                    );
                    let admittedPulls = await findAdmittedPulls();
                    let discoveryAttempts = 1;
                    while (admittedPulls.length === 0 && discoveryAttempts < retryAttempts) {
                      discoveryAttempts += 1;
                      if (retryIntervalMs > 0) {
                        await new Promise((resolve) => {
                          setTimeout(resolve, retryIntervalMs);
                        });
                      }
                      admittedPulls = await findAdmittedPulls();
                    }
                    if (admittedPulls.length !== 1) {
                      throw new Error(
                        `expected one associated merged PR, found ${admittedPulls.length} ` +
                          `after ${discoveryAttempts} discovery attempt(s)`,
                      );
                    }
                    const admittedPull = admittedPulls[0];
                    const admittedMergedAt = Date.parse(admittedPull.merged_at);
                    if (!Number.isFinite(admittedMergedAt)) {
                      throw new Error('merged PR has an invalid merged_at timestamp');
                    }
                    const completedByMerge = (value) => {
                      const timestamp = Date.parse(value || '');
                      return Number.isFinite(timestamp) && timestamp <= admittedMergedAt;
                    };
                    const {data: headCommit} = await github.rest.repos.getCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: admittedHeadSha,
                      per_page: 1,
                    });
                    if (
                      headCommit.sha !== admittedHeadSha ||
                      !targetCommit.commit?.tree?.sha ||
                      targetCommit.commit?.tree?.sha !== headCommit.commit?.tree?.sha
                    ) {
                      throw new Error('merge commit tree differs from the admitted PR head tree');
                    }

                    // The PR run must have used the CI definition already
                    // trusted on main. A PR that changes this workflow must
                    // receive a fresh post-merge execution before later
                    // source-only merges may reuse its admission evidence.
                    const readProtectedWorkflowBlob = async (path, ref) => {
                      const {data: content} = await github.rest.repos.getContent({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        path,
                        ref,
                      });
                      if (
                        Array.isArray(content) ||
                        content.type !== 'file' ||
                        !/^[0-9a-f]{40}$/.test(content.sha || '')
                      ) {
                        throw new Error(`cannot bind ${path} at ${ref}`);
                      }
                      return content.sha;
                    };
                    for (const protectedWorkflow of [
                      '.github/workflows/ci.yml',
                      '.github/workflows/ai-behavior-check.yml',
                    ]) {
                      const baseWorkflowBlob =
                        await readProtectedWorkflowBlob(protectedWorkflow, expectedBefore);
                      const headWorkflowBlob =
                        await readProtectedWorkflowBlob(protectedWorkflow, admittedHeadSha);
                      if (baseWorkflowBlob !== headWorkflowBlob) {
                        throw new Error(`PR changed protected workflow ${protectedWorkflow}`);
                      }
                    }

                    const fullSuiteEvidenceContexts = [
                      'Coverage (current: app)',
                      'Coverage (current: cli)',
                      'Coverage (current: generators)',
                      'Coverage (current: helpers)',
                      'Coverage (current: remaining)',
                      'Coverage (supporting)',
                    ];
                    const admissionContextNames = [
                      ...requiredContexts,
                      ...fullSuiteEvidenceContexts,
                    ];
                    const checkRuns = await github.paginate(
                      github.rest.checks.listForRef,
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: admittedHeadSha,
                        filter: 'latest',
                        per_page: 100,
                      },
                    );
                    const latestByName = new Map();
                    for (const run of checkRuns) {
                      if (
                        run.head_sha !== admittedHeadSha ||
                        run.app?.slug !== 'github-actions' ||
                        !admissionContextNames.includes(run.name)
                      ) {
                        continue;
                      }
                      const current = latestByName.get(run.name);
                      if (!current || run.id > current.id) {
                        latestByName.set(run.name, run);
                      }
                    }
                    const invalidContexts = requiredContexts.filter((name) => {
                      const run = latestByName.get(name);
                      return !run ||
                        run.status !== 'completed' ||
                        run.conclusion !== 'success' ||
                        !completedByMerge(run.completed_at);
                    });
                    if (invalidContexts.length > 0) {
                      throw new Error(
                        `PR head lacks successful Code Admission: ${invalidContexts.join(', ')}`,
                      );
                    }
                    const invalidFullSuiteEvidence = fullSuiteEvidenceContexts.filter(
                      (name) => {
                        const run = latestByName.get(name);
                        return !run ||
                          run.status !== 'completed' ||
                          run.conclusion !== 'success' ||
                          !completedByMerge(run.completed_at);
                      },
                    );
                    if (invalidFullSuiteEvidence.length > 0) {
                      throw new Error(
                        `PR head did not execute the complete coverage suite: ` +
                        `${invalidFullSuiteEvidence.join(', ')}`,
                      );
                    }

                    // AI Behavior is emitted by a separate base-owned
                    // pull_request_target workflow. Bind both its PR-targeted
                    // commit status and the automatic Actions check run.
                    const aiBehaviorCheck = latestByName.get('AI Behavior');
                    const expectedAIStatusTarget =
                      `https://github.com/DingTalk-Real-AI/` +
                      `dingtalk-workspace-cli/pull/${admittedPull.number}`;
                    const aiStatuses = await github.paginate(
                      github.rest.repos.listCommitStatusesForRef,
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: admittedHeadSha,
                        per_page: 100,
                      },
                    );
                    const boundAIStatuses = aiStatuses
                      .filter((status) =>
                        status.context === 'AI Behavior' &&
                        status.target_url === expectedAIStatusTarget,
                      )
                      .sort((left, right) => right.id - left.id);
                    const latestAIStatus = boundAIStatuses[0];
                    if (
                      !latestAIStatus ||
                      latestAIStatus.state !== 'success' ||
                      !completedByMerge(latestAIStatus.updated_at)
                    ) {
                      throw new Error('AI Behavior status is not bound to the admitted PR before merge');
                    }
                    const aiDetailsMatch =
                      /^https:\/\/github\.com\/DingTalk-Real-AI\/dingtalk-workspace-cli\/actions\/runs\/([1-9][0-9]*)\/job\/[1-9][0-9]*$/
                        .exec(aiBehaviorCheck.details_url || '');
                    if (!aiDetailsMatch) {
                      throw new Error('AI Behavior check has an untrusted Actions URL');
                    }
                    const aiRunID = Number(aiDetailsMatch[1]);
                    const {data: aiWorkflowRun} = await github.rest.actions.getWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: aiRunID,
                    });
                    if (
                      aiWorkflowRun.id !== aiRunID ||
                      aiWorkflowRun.name !== 'Code Admission — AI Behavior' ||
                      aiWorkflowRun.path !== '.github/workflows/ai-behavior-check.yml' ||
                      aiWorkflowRun.event !== 'pull_request_target' ||
                      aiWorkflowRun.head_sha !== admittedHeadSha ||
                      aiWorkflowRun.head_branch !== admittedPull.head.ref ||
                      aiWorkflowRun.head_repository?.full_name !==
                        admittedPull.head?.repo?.full_name ||
                      aiWorkflowRun.repository?.full_name !==
                        'DingTalk-Real-AI/dingtalk-workspace-cli' ||
                      aiWorkflowRun.status !== 'completed' ||
                      aiWorkflowRun.conclusion !== 'success' ||
                      !completedByMerge(aiWorkflowRun.updated_at)
                    ) {
                      throw new Error('AI Behavior workflow run is not bound to the admitted PR head');
                    }

                    const {data: ciWorkflow} = await github.rest.actions.getWorkflow({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      workflow_id: '.github/workflows/ci.yml',
                    });
                    if (
                      ciWorkflow.name !== 'CI' ||
                      ciWorkflow.path !== '.github/workflows/ci.yml' ||
                      ciWorkflow.state !== 'active'
                    ) {
                      throw new Error('protected CI workflow identity is not active or exact');
                    }
                    const workflowRuns = await github.paginate(
                      github.rest.actions.listWorkflowRuns,
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        workflow_id: ciWorkflow.id,
                        event: 'pull_request',
                        status: 'success',
                        head_sha: admittedHeadSha,
                        per_page: 100,
                      },
                    );
                    const ciContextNames = [
                      ...requiredContexts.filter((name) => name !== 'AI Behavior'),
                      ...fullSuiteEvidenceContexts,
                    ];
                    const admittedRuns = workflowRuns.filter((run) =>
                      run.name === 'CI' &&
                      run.workflow_id === ciWorkflow.id &&
                      run.path === ciWorkflow.path &&
                      run.event === 'pull_request' &&
                      run.head_sha === admittedHeadSha &&
                      run.head_branch === admittedPull.head.ref &&
                      run.head_repository?.full_name === admittedPull.head?.repo?.full_name &&
                      run.repository?.full_name ===
                        'DingTalk-Real-AI/dingtalk-workspace-cli' &&
                      run.status === 'completed' &&
                      run.conclusion === 'success' &&
                      completedByMerge(run.updated_at) &&
                      ciContextNames.every((name) =>
                        latestByName.get(name)?.details_url?.includes(
                          `/actions/runs/${run.id}/job/`,
                        ),
                      ),
                    );
                    if (admittedRuns.length !== 1) {
                      throw new Error(
                        `expected one exact successful PR CI run, found ${admittedRuns.length}`,
                      );
                    }
                    const admittedRun = admittedRuns[0];
                    const artifacts = await github.paginate(
                      github.rest.actions.listWorkflowRunArtifacts,
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: admittedRun.id,
                        per_page: 100,
                      },
                    );
                    const coverageArtifacts = artifacts.filter((artifact) =>
                      artifact.name === 'coverage-report' &&
                      artifact.expired === false &&
                      artifact.size_in_bytes > 0 &&
                      artifact.size_in_bytes <= 134217728 &&
                      artifact.workflow_run?.id === admittedRun.id &&
                      artifact.workflow_run?.head_sha === admittedHeadSha &&
                      /^sha256:[0-9a-f]{64}$/.test(artifact.digest || '') &&
                      completedByMerge(artifact.updated_at),
                    );
                    if (coverageArtifacts.length !== 1) {
                      throw new Error(
                        `expected one immutable coverage artifact, found ${coverageArtifacts.length}`,
                      );
                    }

                    const coverageArtifact = coverageArtifacts[0];
                    admittedMerge = true;
                    admittedMergeHeadSha = admittedHeadSha;
                    admittedMergeRunId = String(admittedRun.id);
                    admittedMergeArtifactId = String(coverageArtifact.id);
                    admittedMergeArtifactDigest = coverageArtifact.digest;
                    fullSuite = false;
                    releaseSensitive = false;
                    interfaceSensitive = false;
                    mcpSensitive = false;
                    editionSensitive = false;
                    platformSensitive = false;
                    fastPathTrust =
                      `merge tree reuses PR #${admittedPull.number} ` +
                      `CI run ${admittedRun.id} artifact ${coverageArtifact.id}`;
                  } catch (error) {
                    requireFullMain();
                    fastPathTrust =
                      `admitted-merge reuse unavailable; full main suite required: ` +
                      `${error.message}`;
                    core.warning(fastPathTrust);
                  }
                }
              }
            }

            core.setOutput('changelog_only', String(changelogOnly));
            core.setOutput('release_seal_only', String(releaseSealOnly));
            core.setOutput('changelog_changed', String(changelogChanged));
            core.setOutput('docs_only', String(docsOnly));
            core.setOutput('full_suite', String(fullSuite));
            core.setOutput('release_sensitive', String(releaseSensitive));
            core.setOutput('interface_sensitive', String(interfaceSensitive));
            core.setOutput('mcp_sensitive', String(mcpSensitive));
            core.setOutput('edition_sensitive', String(editionSensitive));
            core.setOutput('platform_sensitive', String(platformSensitive));
            core.setOutput('admitted_merge', String(admittedMerge));
            core.setOutput('admitted_merge_head_sha', admittedMergeHeadSha);
            core.setOutput('admitted_merge_run_id', admittedMergeRunId);
            core.setOutput('admitted_merge_artifact_id', admittedMergeArtifactId);
            core.setOutput('admitted_merge_artifact_digest', admittedMergeArtifactDigest);
            await core.summary
              .addHeading('Code Admission scope')
              .addRaw(`- Event: \`${context.eventName}\`\n`)
              .addRaw(`- Metadata-only fast path: \`${changelogOnly}\`\n`)
              .addRaw(`- Release-seal fragments only: \`${releaseSealOnly}\`\n`)
              .addRaw(`- CHANGELOG touched: \`${changelogChanged}\`\n`)
              .addRaw(`- Documentation-only: \`${docsOnly}\`\n`)
              .addRaw(`- Full suite: \`${fullSuite}\`\n`)
              .addRaw(`- Release-sensitive: \`${releaseSensitive}\`\n`)
              .addRaw(`- Interface-sensitive: \`${interfaceSensitive}\`\n`)
              .addRaw(`- MCP-sensitive: \`${mcpSensitive}\`\n`)
              .addRaw(`- Edition-sensitive: \`${editionSensitive}\`\n`)
              .addRaw(`- Native-platform risk paths touched: \`${platformSensitive}\`\n`)
              .addRaw(`- Admitted merge reuse: \`${admittedMerge}\`\n`)
              .addRaw(`- Changed files: \`${files.length}\`\n`)
              .addRaw(`- Fast-path trust: ${fastPathTrust}\n`)
              .write();

      - name: Record CHANGELOG-only fast path
        if: steps.classify.outputs.changelog_only == 'true'
        env:
          RELEASE_SEAL_ONLY: ${{ steps.classify.outputs.release_seal_only }}
        run: |
          if [ "$RELEASE_SEAL_ONLY" = true ]; then
            echo "Lint is satisfied by the trusted release-seal fragment Policy path." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Lint is satisfied by the trusted CHANGELOG-only Policy path." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record documentation-only fast path
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only == 'true' && steps.classify.outputs.admitted_merge != 'true'
        run: echo "Lint is satisfied by the non-executable documentation scope." >> "$GITHUB_STEP_SUMMARY"

      - name: Record admitted-merge reuse
        if: steps.classify.outputs.admitted_merge == 'true'
        env:
          ADMITTED_HEAD_SHA: ${{ steps.classify.outputs.admitted_merge_head_sha }}
          ADMITTED_RUN_ID: ${{ steps.classify.outputs.admitted_merge_run_id }}
        run: |
          echo "Lint reuses successful Code Admission from PR head $ADMITTED_HEAD_SHA (CI run $ADMITTED_RUN_ID)." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        uses: actions/checkout@v4

      - name: Set up Go
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Test Package Plan
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        run: make test-plan

      - name: Format Check
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        run: make format-check

      - name: Go Vet
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        run: go vet ./...

      - name: Check GitHub Actions workflows
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Test reviewer routing and merge authority policy
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        run: |
          node .github/reviewer-routing.test.js
          node .github/reviewer-merge-authority.test.js

      - name: Test npm installer smoke (prune, backup, publish)
        if: steps.classify.outputs.changelog_only != 'true' && steps.classify.outputs.docs_only != 'true' && steps.classify.outputs.admitted_merge != 'true'
        env:
          XDG_CONFIG_HOME: ""
        run: node test/scripts/install_js_smoke.mjs

  runtime-payload:
    name: Validate Runtime Payload
    needs: lint
    if: ${{ needs.lint.outputs.admitted_merge == 'true' || (needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.release_sensitive == 'true' || needs.lint.outputs.platform_sensitive == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install runtime inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm binutils file

      - name: Verify runtime payload
        run: ./scripts/policy/check-runtime-payload.sh

      - name: Compile runtime context targets
        run: |
          set -euo pipefail
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go test -c ./internal/runtimecontext -o "$RUNNER_TEMP/runtimecontext-${os}-${arch}${suffix}"
          done

  test-focused:
    name: "Test (focused: ${{ matrix.shard }})"
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true' && needs.lint.outputs.full_suite != 'true' }}
    runs-on: ubuntu-latest
    # Each shard owns one bounded slice of the impacted set, so no single job
    # carries internal/app together with every reverse dependency. The shard
    # list and per-shard execution below mirror test-race, which runs the same
    # shards at full-suite scope; release-scripts is included because its
    # dedicated job only runs at full-suite or release-sensitive scope, and
    # dropping it here would stop testing test/scripts changes entirely.
    # internal/app keeps nine process-isolated logical partitions, balanced
    # across three physical app lanes. The lane names and their exact partition
    # union are pinned to the helper by TestCIAppRaceLaneMatrixMatchesHelper.
    # This preserves memory release between Go test processes while reducing
    # hosted-runner fan-out by six jobs per focused run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - app-lane-1
          - app-lane-2
          - app-lane-3
          - generators
          - helpers
          - cli
          - smoke
          - remaining
          - release-scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authoritative synthetic merge
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA" || {
            echo "focused test merge first parent does not match event base" >&2
            exit 1
          }
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" || {
            echo "focused test merge second parent does not match event head" >&2
            exit 1
          }
          echo "TEST_BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
          echo "TEST_HEAD_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Select impacted packages for shard
        id: select
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Every app lane tests the same single internal/app package, so the
          # impacted-package query uses the base shard name and the lane only
          # selects which process-isolated test partitions run.
          package_shard="$TEST_SHARD"
          case "$TEST_SHARD" in
            app-lane-*) package_shard=app ;;
          esac
          package_output="$(
            ./scripts/ci/changed-test-packages.sh \
              list-shard "$package_shard" "$TEST_BASE_REF" "$TEST_HEAD_REF"
          )"
          if [ -z "$package_output" ]; then
            echo "No buildable Go package in shard $TEST_SHARD is affected by this revision." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "affected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The package list travels through a file rather than a step output:
          # reading it with `mapfile < file` has unambiguous line semantics,
          # whereas a here-string over a multi-line output would append an extra
          # empty element if the value ever carried a trailing newline, and an
          # empty element would reach go test as an empty package argument.
          printf '%s\n' "$package_output" > "$RUNNER_TEMP/focused-shard-packages.txt"
          echo "affected=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: ${{ matrix.shard == 'remaining' && steps.select.outputs.affected == 'true' }}
        run: make build

      - name: Install archive tooling
        if: ${{ matrix.shard == 'release-scripts' && steps.select.outputs.affected == 'true' }}
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null; then
            echo "zip and unzip are already available"
          else
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Test shard with Race Detection
        if: ${{ steps.select.outputs.affected == 'true' }}
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t packages < "$RUNNER_TEMP/focused-shard-packages.txt"
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            test -n "$package" || {
              echo "shard package list contains an empty entry" >&2
              exit 1
            }
          done
          case "$TEST_SHARD" in
            app-lane-*)
              # Each lane invokes several logical partitions sequentially, and
              # every partition remains a fresh Go test process so framework
              # registries are released between partitions. The helper verifies
              # that all lanes cover every logical partition exactly once.
              test "${#packages[@]}" -eq 1
              ./scripts/ci/run-app-race-tests.sh run-lane "${packages[0]}" "${TEST_SHARD#app-}"
              exit 0
              ;;
          esac
          if [ "$TEST_SHARD" = "release-scripts" ]; then
            # Mirror the dedicated release-contract job: these suites shell out
            # to archive tooling and are not race-instrumented there.
            go test -v -count=1 -timeout=10m "${packages[@]}"
            exit 0
          fi
          # cli/smoke own heavy NewRootCommand / Schema assembly under -race;
          # give them a dedicated package timeout on slower hosted runners.
          timeout_budget=12m
          if [ "$TEST_SHARD" = "cli" ] ||
             [ "$TEST_SHARD" = "smoke" ]; then
            timeout_budget=15m
          fi
          go test -v -race -count=1 -timeout="$timeout_budget" "${packages[@]}"

  test-race:
    name: "Test (race: ${{ matrix.shard }})"
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    # internal/app keeps nine process-isolated logical partitions, balanced
    # across three physical app lanes. The lane names and exact partition union
    # are pinned to the helper by TestCIAppRaceLaneMatrixMatchesHelper. This
    # preserves registry release while reducing hosted-runner fan-out by six
    # jobs. cli/smoke retain extra timeout headroom for setup + assembly.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - app-lane-1
          - app-lane-2
          - app-lane-3
          - generators
          - helpers
          - cli
          - smoke
          - remaining
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        if: ${{ matrix.shard == 'remaining' }}
        run: make build

      - name: Test shard with Race Detection
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Every app lane tests the same single internal/app package, so the
          # package query uses the base shard name and the lane only selects
          # which process-isolated test partitions run.
          package_shard="$TEST_SHARD"
          case "$TEST_SHARD" in
            app-lane-*) package_shard=app ;;
          esac
          package_output="$(./scripts/ci/test-packages.sh list "$package_shard")"
          test -n "$package_output"
          mapfile -t packages <<< "$package_output"
          test "${#packages[@]}" -gt 0
          case "$TEST_SHARD" in
            app-lane-*)
              # Each lane invokes several logical partitions sequentially, and
              # every partition remains a fresh Go test process so framework
              # registries are released between partitions. The helper verifies
              # that all lanes cover every logical partition exactly once.
              test "${#packages[@]}" -eq 1
              ./scripts/ci/run-app-race-tests.sh run-lane "${packages[0]}" "${TEST_SHARD#app-}"
              exit 0
              ;;
          esac
          # cli/smoke own heavy NewRootCommand / Schema assembly under -race;
          # give them a dedicated package timeout on slower hosted runners.
          timeout_budget=12m
          if [ "$TEST_SHARD" = "cli" ] ||
             [ "$TEST_SHARD" = "smoke" ]; then
            timeout_budget=15m
          fi
          go test -v -race -count=1 -timeout="$timeout_budget" "${packages[@]}"

  test-release-scripts:
    name: Test (workflow and release contracts)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.release_sensitive == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install archive tooling
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null; then
            echo "zip and unzip are already available"
          else
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Test release scripts
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
        run: |
          set -euo pipefail
          package_output="$(./scripts/ci/test-packages.sh list release-scripts)"
          test -n "$package_output"
          mapfile -t packages <<< "$package_output"
          test "${#packages[@]}" -gt 0
          go test -v -count=1 -timeout=10m "${packages[@]}"

  test-cross-platform:
    name: Test (cross-platform compile)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compile supported operating systems
        shell: bash
        run: |
          set -eu
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            output="$RUNNER_TEMP/dws-${goos}-${goarch}"
            if [ "$goos" = windows ]; then
              output="${output}.exe"
            fi
            printf 'compile %s/%s\n' "$goos" "$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -o "$output" ./cmd
          done

  test:
    name: Test
    needs:
      - lint
      - test-focused
      - test-race
      - test-release-scripts
      - test-cross-platform
      - test-darwin
      - test-windows
    if: ${{ always() && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify test shards
        env:
          CHANGELOG_ONLY: ${{ needs.lint.outputs.changelog_only }}
          DOCS_ONLY: ${{ needs.lint.outputs.docs_only }}
          ADMITTED_MERGE: ${{ needs.lint.outputs.admitted_merge }}
          FULL_SUITE: ${{ needs.lint.outputs.full_suite }}
          RELEASE_SENSITIVE: ${{ needs.lint.outputs.release_sensitive }}
          FOCUSED_RESULT: ${{ needs.test-focused.result }}
          RACE_RESULT: ${{ needs.test-race.result }}
          RELEASE_SCRIPTS_RESULT: ${{ needs.test-release-scripts.result }}
          CROSS_PLATFORM_RESULT: ${{ needs.test-cross-platform.result }}
          DARWIN_RESULT: ${{ needs.test-darwin.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          failed=0
          if [ "$CHANGELOG_ONLY" = true ] ||
             [ "$DOCS_ONLY" = true ] ||
             [ "$ADMITTED_MERGE" = true ]; then
            for shard in \
              "focused shards:$FOCUSED_RESULT" \
              "race shards:$RACE_RESULT" \
              "release scripts:$RELEASE_SCRIPTS_RESULT" \
              "cross-platform compile:$CROSS_PLATFORM_RESULT" \
              "macOS native:$DARWIN_RESULT" \
              "Windows native:$WINDOWS_RESULT"
            do
              name="${shard%%:*}"
              result="${shard#*:}"
              printf '%s: %s\n' "$name" "$result"
              if [ "$result" != skipped ]; then
                failed=1
              fi
            done
            test "$failed" -eq 0
            exit
          fi

          focused_expected=success
          race_expected=skipped
          if [ "$FULL_SUITE" = true ]; then
            focused_expected=skipped
            race_expected=success
          fi
          release_expected=skipped
          if [ "$FULL_SUITE" = true ] || [ "$RELEASE_SENSITIVE" = true ]; then
            release_expected=success
          fi
          for shard in \
            "focused shards:$FOCUSED_RESULT:$focused_expected" \
            "race shards:$RACE_RESULT:$race_expected" \
            "release scripts:$RELEASE_SCRIPTS_RESULT:$release_expected" \
            "cross-platform compile:$CROSS_PLATFORM_RESULT:success"
          do
            name="${shard%%:*}"
            remainder="${shard#*:}"
            result="${remainder%%:*}"
            expected="${remainder#*:}"
            printf '%s: %s (expected %s)\n' "$name" "$result" "$expected"
            if [ "$result" != "$expected" ]; then
              failed=1
            fi
          done

          native_expected=skipped
          if [ "$FULL_SUITE" = true ]; then
            native_expected=success
          fi
          for native in \
            "macOS native:$DARWIN_RESULT" \
            "Windows native:$WINDOWS_RESULT"
          do
            name="${native%%:*}"
            result="${native#*:}"
            printf '%s: %s\n' "$name" "$result"
            if [ "$result" != "$native_expected" ]; then
              failed=1
            fi
          done
          test "$failed" -eq 0

      # Null and non-built-in merge identities emit either the protected-main
      # push or the trusted pull_request_target closed repair. The built-in
      # Actions identity is the exceptional unsafe path, so its own token must
      # prove that main-merge-writers never lets it update main.
      - name: Verify auto-merge identity
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REVIEWER_ROUTER_APP_SLUG: ${{ vars.REVIEWER_ROUTER_APP_SLUG }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const eventHeadSha = context.payload.pull_request.head.sha;
            const eventBaseSha = context.payload.pull_request.base.sha;
            const configuredAppSlug = process.env.REVIEWER_ROUTER_APP_SLUG?.trim();
            const reviewedForkAppSlug = 'dingtalk-dws-reviewer-router';
            const pullHeadRepository =
              context.payload.pull_request.head.repo.full_name?.toLowerCase();
            const baseRepository = `${owner}/${repo}`.toLowerCase();
            const isForkPull =
              Boolean(pullHeadRepository) && pullHeadRepository !== baseRepository;
            const appSlug =
              configuredAppSlug || (isForkPull ? reviewedForkAppSlug : '');
            if (
              !appSlug ||
              appSlug !== appSlug.toLowerCase() ||
              appSlug === 'github-actions'
            ) {
              core.setFailed(
                'Reviewer Router App slug repository variable is missing or unsafe.',
              );
              return;
            }
            if (!configuredAppSlug) {
              core.info(
                `Fork pull request cannot read the repository App slug variable; using the reviewed public slug ${reviewedForkAppSlug}.`,
              );
            }
            const expectedAppOwner = `${appSlug}[bot]`;
            const writerRulesetName = 'main-merge-writers';
            const skipWorkflowPattern =
              /\[(?:skip ci|ci skip|no ci|skip actions|actions skip)\]|\bskip-checks\s*:\s*true\b/i;
            const {data: repository} = await github.rest.repos.get({owner, repo});
            function classifyMergeDefaults(repository) {
              if (
                repository === null ||
                typeof repository !== 'object' ||
                Array.isArray(repository)
              ) {
                return 'invalid';
              }
              const hasTitle = Object.prototype.hasOwnProperty.call(
                repository,
                'merge_commit_title',
              );
              const hasMessage = Object.prototype.hasOwnProperty.call(
                repository,
                'merge_commit_message',
              );
              if (!hasTitle && !hasMessage) {
                return 'omitted';
              }
              if (!hasTitle || !hasMessage) {
                return 'invalid';
              }
              if (
                repository.merge_commit_title === 'MERGE_MESSAGE' &&
                ['PR_TITLE', 'BLANK'].includes(repository.merge_commit_message)
              ) {
                return 'reviewed';
              }
              return 'invalid';
            }
            const mergeDefaultsProjection = classifyMergeDefaults(repository);
            if (mergeDefaultsProjection === 'invalid') {
              core.setFailed(
                'Repository merge-message defaults are malformed or changed from their reviewed values.',
              );
              return;
            }
            if (mergeDefaultsProjection === 'omitted') {
              core.info(
                'Read-only CI cannot observe repository merge-message defaults; exact validation is delegated to the dedicated App.',
              );
            }

            const appliedRules = await github.paginate(
              'GET /repos/{owner}/{repo}/rules/branches/{branch}',
              {owner, repo, branch: 'main', per_page: 100},
            );
            const repositorySource = `${owner}/${repo}`.toLowerCase();
            const applicableRulesetIDs = [
              ...new Set(
                appliedRules
                  .filter(rule =>
                    rule.ruleset_source_type === 'Repository' &&
                    rule.ruleset_source?.toLowerCase() === repositorySource &&
                    Number.isSafeInteger(Number(rule.ruleset_id)) &&
                    Number(rule.ruleset_id) > 0,
                  )
                  .map(rule => Number(rule.ruleset_id)),
              ),
            ];
            const activeMainRulesets = [];
            for (const rulesetID of applicableRulesetIDs) {
              const {data: ruleset} = await github.request(
                'GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',
                {owner, repo, ruleset_id: rulesetID},
              );
              if (
                ruleset.enforcement !== 'active' ||
                ruleset.target !== 'branch' ||
                ruleset.source_type !== 'Repository' ||
                ruleset.source?.toLowerCase() !== repositorySource
              ) {
                core.setFailed(
                  `Applicable repository ruleset ${ruleset.name || rulesetID} is not an active branch ruleset owned by this repository.`,
                );
                return;
              }
              activeMainRulesets.push(ruleset);
            }

            const writerRulesets = activeMainRulesets.filter(
              ruleset => ruleset.name === writerRulesetName,
            );
            if (writerRulesets.length !== 1) {
              core.setFailed(
                `Expected exactly one active ${writerRulesetName} ruleset on main; found ${writerRulesets.length}.`,
              );
              return;
            }
            const writerRuleset = writerRulesets[0];
            const writerIncludes = writerRuleset.conditions?.ref_name?.include || [];
            const writerExcludes = writerRuleset.conditions?.ref_name?.exclude || [];
            // GitHub's read projection omits the entire parameters property
            // when this exception is disabled. Accept only that exact omission
            // or a one-field object containing exact false.
            function isStrictUpdateRule(rule) {
              if (rule?.type !== 'update') {
                return false;
              }
              if (!Object.prototype.hasOwnProperty.call(rule, 'parameters')) {
                return true;
              }
              const parameters = rule.parameters;
              if (
                parameters === null ||
                typeof parameters !== 'object' ||
                Array.isArray(parameters)
              ) {
                return false;
              }
              const parameterKeys = Object.keys(parameters);
              return (
                parameterKeys.length === 1 &&
                parameterKeys[0] === 'update_allows_fetch_and_merge' &&
                parameters.update_allows_fetch_and_merge === false
              );
            }
            function isStrictGraphQLUpdateRule(restRuleset, graphRuleset) {
              const restRulesetID = Number(restRuleset?.id);
              const graphRulesetID = Number(graphRuleset?.databaseId);
              const graphRules = graphRuleset?.rules;
              const graphRule = graphRules?.nodes?.[0];
              return (
                Number.isSafeInteger(restRulesetID) &&
                restRulesetID > 0 &&
                graphRulesetID === restRulesetID &&
                graphRuleset.name === restRuleset.name &&
                graphRuleset.enforcement === 'ACTIVE' &&
                graphRuleset.target === 'BRANCH' &&
                graphRules?.totalCount === 1 &&
                graphRules.nodes?.length === 1 &&
                graphRule?.type === 'UPDATE' &&
                graphRule.parameters?.__typename === 'UpdateParameters' &&
                graphRule.parameters.updateAllowsFetchAndMerge === false
              );
            }
            if (
              writerIncludes.length !== 1 ||
              writerIncludes[0] !== 'refs/heads/main' ||
              writerExcludes.length !== 0 ||
              typeof writerRuleset.node_id !== 'string' ||
              !writerRuleset.node_id ||
              writerRuleset.rules?.length !== 1 ||
              !isStrictUpdateRule(writerRuleset.rules[0]) ||
              writerRuleset.current_user_can_bypass !== 'never'
            ) {
              core.setFailed(
                `${writerRulesetName} must target only refs/heads/main, contain only the strict update rule, and deny this built-in Actions identity any bypass.`,
              );
              return;
            }
            const {node: graphWriterRuleset} = await github.graphql(
              `query ReviewerRouterWriterRule($rulesetID: ID!) {
                node(id: $rulesetID) {
                  ... on RepositoryRuleset {
                    databaseId
                    name
                    enforcement
                    target
                    rules(first: 2) {
                      totalCount
                      nodes {
                        type
                        parameters {
                          __typename
                          ... on UpdateParameters {
                            updateAllowsFetchAndMerge
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              {rulesetID: writerRuleset.node_id},
            );
            if (!isStrictGraphQLUpdateRule(writerRuleset, graphWriterRuleset)) {
              core.setFailed(
                `${writerRulesetName} must expose one strict UPDATE rule with updateAllowsFetchAndMerge=false through GraphQL.`,
              );
              return;
            }

            const maxAttempts = 6;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const {data: currentPull} = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              if (
                currentPull.head.sha !== eventHeadSha ||
                currentPull.base.sha !== eventBaseSha ||
                currentPull.state !== 'open' ||
                currentPull.draft ||
                currentPull.base.ref !== 'main'
              ) {
                core.setFailed(
                  `PR #${pullNumber} state or revision changed before the Test aggregate verified auto-merge identity.`,
                );
                return;
              }
              const mergeTexts = [
                currentPull.title,
                currentPull.auto_merge?.commit_title,
                currentPull.auto_merge?.commit_message,
              ].filter(value => typeof value === 'string');
              if (mergeTexts.some(value => skipWorkflowPattern.test(value))) {
                core.setFailed(
                  `PR #${pullNumber} merge metadata contains a GitHub workflow-skip directive.`,
                );
                return;
              }
              if (!currentPull.auto_merge) {
                core.info(
                  `PR #${pullNumber} has no auto-merge request; protected-main push or closed-event repair remains authoritative.`,
                );
                return;
              }
              const enabledBy = currentPull.auto_merge.enabled_by?.login?.toLowerCase();
              const safeCommitHeadline = `Merge pull request #${pullNumber}`;
              const safeCommitBody =
                `Merged by the dedicated Reviewer Router GitHub App for PR #${pullNumber}.`;
              if (
                enabledBy === expectedAppOwner &&
                currentPull.auto_merge.commit_title === safeCommitHeadline &&
                currentPull.auto_merge.commit_message === safeCommitBody
              ) {
                core.info(
                  `PR #${pullNumber} auto-merge is owned by the reviewed ${expectedAppOwner} identity with fixed metadata.`,
                );
                return;
              }
              if (attempt < maxAttempts) {
                core.info(
                  `PR #${pullNumber} auto-merge owner or metadata is not the reviewed App value; waiting for Reviewer Router takeover (${attempt}/${maxAttempts}).`,
                );
                await new Promise(resolve => setTimeout(resolve, 5000));
                continue;
              }
              core.setFailed(
                `PR #${pullNumber} auto-merge must be null or owned by ${expectedAppOwner} with the reviewed fixed metadata.`,
              );
            }

  test-darwin:
    name: Test (macOS auth/keychain)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test macOS auth and Keychain packages with Race Detection
        run: go test -v -race -count=1 -timeout=6m ./internal/keychain ./internal/auth

      - name: Test macOS auth migration, Keychain diagnostics, and upgrade self-heal with Race Detection
        run: go test -v -race -count=1 -timeout=5m ./internal/app -run '^(TestValidateNewBinary_RecoversFromUnsignedDarwin|Test(CrossPlatformCoverage)?Auth(MigrateKeychain|StatusDiagnosticReportsCiphertextKeyMismatch))'

  test-windows:
    name: Test (Windows)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows CLI
        run: go build -o dws.exe ./cmd

      - name: Test Windows auth and DPAPI packages
        run: go test -v -count=1 -timeout=10m ./internal/keychain ./internal/auth

      - name: Test Windows auth migration and portable auth diagnostics
        run: go test -v -count=1 -timeout=5m ./internal/app -run '^Test(CrossPlatformCoverage)?Auth(MigrateKeychain|StatusDiagnosticReportsCiphertextKeyMismatch|ExportRejectsWindowsDPAPIBackend|ImportRejectsWindowsDPAPIBackend)'

  coverage-darwin:
    name: Coverage (macOS)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.platform_sensitive == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve authoritative coverage base
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          echo "COVERAGE_BASE_REF=$base_ref" >> "$GITHUB_ENV"

      - name: Run and enforce macOS changed-code coverage
        env:
          COVERAGE_PLATFORM_TIMEOUT: 15m
        run: make coverage-gate-platform BASE_REF="$COVERAGE_BASE_REF" PROFILE=coverage-darwin.txt

      - name: Upload macOS coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-darwin
          path: coverage-darwin.txt

  coverage-windows:
    name: Coverage (Windows)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.platform_sensitive == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve authoritative coverage base
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          echo "COVERAGE_BASE_REF=$base_ref" >> "$GITHUB_ENV"

      - name: Run and enforce Windows changed-code coverage
        shell: bash
        run: ./scripts/policy/run-platform-coverage-gate.sh --base-ref "$COVERAGE_BASE_REF" --profile coverage-windows.txt

      - name: Upload Windows coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: coverage-windows.txt

  coverage-current:
    name: Coverage (current)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true' && needs.lint.outputs.full_suite != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve authoritative coverage base
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          echo "COVERAGE_BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "COVERAGE_HEAD_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      - name: Run scoped unit tests with coverage
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
        run: |
          set -euo pipefail
          changed_output="$(
            ./scripts/ci/changed-test-packages.sh \
              changed "$COVERAGE_BASE_REF" "$COVERAGE_HEAD_REF"
          )"
          impacted_output="$(
            # Smoke has no production statements and launches a subprocess;
            # the always-on non-full-suite focused smoke shard owns it, while
            # -cover only adds runtime stderr noise.
            ./scripts/ci/changed-test-packages.sh \
              list "$COVERAGE_BASE_REF" "$COVERAGE_HEAD_REF" |
              awk '$0 != "github.com/DingTalk-Real-AI/dingtalk-workspace-cli/test/smoke"'
          )"
          if [ -z "$changed_output" ] || [ -z "$impacted_output" ]; then
            printf 'mode: atomic\n' > coverage.txt
            echo "No buildable Go package needs scoped coverage." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            mapfile -t changed_packages <<< "$changed_output"
            mapfile -t impacted_packages <<< "$impacted_output"
            coverpkg="$(IFS=,; echo "${changed_packages[*]}")"
            go test -count=1 -p 1 \
              -coverpkg="$coverpkg" \
              -coverprofile=coverage.txt \
              -covermode=atomic \
              "${impacted_packages[@]}"
          fi
          if [ "$(wc -l < coverage.txt)" -gt 1 ]; then
            go tool cover -func=coverage.txt
          fi

      - name: Upload current coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-current-profile
          path: coverage.txt
          retention-days: 1

  coverage-current-full:
    name: "Coverage (current: ${{ matrix.shard }})"
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - app
          - cli
          - generators
          - helpers
          - remaining
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install archive tooling
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null; then
            echo "zip and unzip are already available"
          else
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Build
        run: make build

      # Keep the matrix at five hosted runners. The shared runner balances the
      # existing internal/app test partitions across those jobs, bounds package
      # parallelism inside each runner, and preserves exact package ownership.
      - name: Run current shard tests with coverage
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
          COVERAGE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          ./scripts/ci/run-coverage-shard.sh run \
            "$COVERAGE_SHARD" "coverage-shard-$COVERAGE_SHARD.txt"
          go tool cover -func="coverage-shard-$COVERAGE_SHARD.txt" | tail -n 1

      - name: Upload current shard coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-current-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.txt
          retention-days: 1

  coverage-supporting:
    name: Coverage (supporting)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install archive tooling
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null; then
            echo "zip and unzip are already available"
          else
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Run policy and shortcut coverage
        run: |
          go test -count=1 -coverprofile=coverage-policy.txt -covermode=atomic ./pkg/... ./scripts/policy/...
          go test -count=1 \
            -run '^(TestAllShortcuts|TestCrossPlatformCoverage)' \
            -coverpkg=./internal/app,./internal/helpers,./internal/shortcut/... \
            -coverprofile=coverage-shortcut.txt \
            -covermode=atomic \
            ./internal/app ./internal/helpers ./internal/shortcut/...

      - name: Upload supporting coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-supporting-profiles
          path: |
            coverage-policy.txt
            coverage-shortcut.txt
          retention-days: 1

  coverage-baseline:
    name: Coverage (baseline)
    needs: lint
