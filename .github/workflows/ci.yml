          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          echo "COVERAGE_BASE_REF=$base_ref" >> "$GITHUB_ENV"

      # The merge-base full-suite profile is a pure function of the base
      # commit. Reuse the profile published by the last green push run of
      # exactly that commit instead of re-running the whole suite; any key
      # mismatch falls back to authoritative recomputation. Exact key only,
      # never prefix fallback: a near-miss profile would compare the
      # candidate against the wrong commit.
      - name: Restore cached merge-base coverage profile
        id: baseline-cache
        if: needs.lint.outputs.full_suite == 'true'
        uses: actions/cache/restore@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ env.COVERAGE_BASE_REF }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Materialize cached merge-base coverage profile
        if: needs.lint.outputs.full_suite == 'true' && steps.baseline-cache.outputs.cache-hit == 'true'
        run: |
          set -eu
          test -s coverage-cache.txt
          test "$(head -n 1 coverage-cache.txt)" = "mode: atomic"
          cp coverage-cache.txt coverage-base.txt

      - name: Install archive tooling
        if: needs.lint.outputs.full_suite == 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null; then
            echo "zip and unzip are already available"
          else
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Run baseline unit tests with coverage
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
          FULL_SUITE: ${{ needs.lint.outputs.full_suite }}
        run: |
          set -euo pipefail
          changed_output=
          impacted_output=
          if [ "$FULL_SUITE" != true ]; then
            changed_output="$(
              ./scripts/ci/changed-test-packages.sh \
                changed "$COVERAGE_BASE_REF" HEAD
            )"
            impacted_output="$(
              # Keep the baseline plan symmetric with Coverage (current).
              ./scripts/ci/changed-test-packages.sh \
                list "$COVERAGE_BASE_REF" HEAD |
                awk '$0 != "github.com/DingTalk-Real-AI/dingtalk-workspace-cli/test/smoke"'
            )"
          fi
          base_worktree="$(mktemp -d "${RUNNER_TEMP}/dws-coverage-base.XXXXXX")"
          rmdir "$base_worktree"
          cleanup() {
            git worktree remove --force "$base_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$base_worktree" "$COVERAGE_BASE_REF"
          (
            cd "$base_worktree"
            if [ "$FULL_SUITE" = true ]; then
              DWS_COVERAGE_ROOT="$base_worktree" \
                "$GITHUB_WORKSPACE/scripts/ci/run-full-coverage.sh" \
                "$GITHUB_WORKSPACE/coverage-base.txt"
            elif [ -z "$changed_output" ] || [ -z "$impacted_output" ]; then
              printf 'mode: atomic\n' > "$GITHUB_WORKSPACE/coverage-base.txt"
            else
              mapfile -t changed_packages <<< "$changed_output"
              mapfile -t impacted_packages <<< "$impacted_output"
              coverpkg="$(IFS=,; echo "${changed_packages[*]}")"
              go test -count=1 \
                -p 1 \
                -timeout=10m \
                -coverpkg="$coverpkg" \
                -coverprofile="$GITHUB_WORKSPACE/coverage-base.txt" \
                -covermode=atomic \
                "${impacted_packages[@]}"
            fi
          )

      - name: Prepare merge-base coverage profile cache
        if: needs.lint.outputs.full_suite == 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          test -s coverage-base.txt
          test "$(head -n 1 coverage-base.txt)" = "mode: atomic"
          cp coverage-base.txt coverage-cache.txt

      - name: Save merge-base coverage profile cache
        if: needs.lint.outputs.full_suite == 'true' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ env.COVERAGE_BASE_REF }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Upload baseline coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-profile
          path: coverage-base.txt
          retention-days: 1

  # Metadata-only pushes promote an exact predecessor profile. A protected
  # two-parent merge whose final tree exactly equals an already admitted PR
  # head instead reuses that successful CI run's immutable coverage artifact.
  # Both paths publish and verify the new main SHA's exact cache key.
  coverage-main-metadata:
    name: Coverage (main metadata cache)
    needs: lint
    if: ${{ github.event_name == 'push' && (needs.lint.outputs.changelog_only == 'true' || needs.lint.outputs.docs_only == 'true' || needs.lint.outputs.admitted_merge == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Go
        id: setup-go-metadata
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify metadata-only main successor
        if: needs.lint.outputs.admitted_merge != 'true'
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          full_commit='^[0-9a-f]{40}$'
          [[ "$PUSH_BEFORE_SHA" =~ $full_commit ]]
          [[ "$PUSH_AFTER_SHA" =~ $full_commit ]]
          test "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000
          test "$PUSH_AFTER_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse --verify "${PUSH_BEFORE_SHA}^{commit}" >/dev/null
          git merge-base --is-ancestor "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"

          changed_count=0
          while IFS= read -r -d '' path; do
            changed_count=$((changed_count + 1))
            case "$path" in
              CHANGELOG.md|README.md|README_zh.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md|LICENSE|NOTICE|.github/PULL_REQUEST_TEMPLATE.md|.github/ISSUE_TEMPLATE/*|docs/*)
                ;;
              .changes/*)
                if [[ "$path" =~ ^\.changes/[a-z0-9][a-z0-9._-]*\.md$ ]] ||
                   [[ "$path" =~ ^\.changes/released/[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?/[a-z0-9][a-z0-9._-]*\.md$ ]]; then
                  continue
                fi
                echo "Refusing coverage-cache promotion for unreviewed change-fragment path: $path" >&2
                exit 1
                ;;
              *)
                echo "Refusing coverage-cache promotion for executable path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only --no-renames -z "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")
          test "$changed_count" -gt 0
          echo "COVERAGE_SOURCE_REF=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"

      - name: Restore existing current-SHA coverage profile
        id: metadata-current-cache
        uses: actions/cache/restore@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ github.sha }}-go${{ steps.setup-go-metadata.outputs.go-version }}

      - name: Validate existing current-SHA coverage profile
        if: steps.metadata-current-cache.outputs.cache-hit == 'true'
        run: |
          set -eu
          test -s coverage-cache.txt
          test "$(head -n 1 coverage-cache.txt)" = "mode: atomic"

      - name: Download admitted PR coverage profile
        id: admitted-coverage
        if: needs.lint.outputs.admitted_merge == 'true' && steps.metadata-current-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMITTED_HEAD_SHA: ${{ needs.lint.outputs.admitted_merge_head_sha }}
          ADMITTED_RUN_ID: ${{ needs.lint.outputs.admitted_merge_run_id }}
          ADMITTED_ARTIFACT_ID: ${{ needs.lint.outputs.admitted_merge_artifact_id }}
          ADMITTED_ARTIFACT_DIGEST: ${{ needs.lint.outputs.admitted_merge_artifact_digest }}
        run: |
          if bash -euo pipefail <<'VERIFY'
          full_commit='^[0-9a-f]{40}$'
          positive_integer='^[1-9][0-9]*$'
          artifact_digest='^sha256:[0-9a-f]{64}$'
          [[ "$ADMITTED_HEAD_SHA" =~ $full_commit ]]
          [[ "$ADMITTED_RUN_ID" =~ $positive_integer ]]
          [[ "$ADMITTED_ARTIFACT_ID" =~ $positive_integer ]]
          [[ "$ADMITTED_ARTIFACT_DIGEST" =~ $artifact_digest ]]

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ADMITTED_ARTIFACT_ID" \
            > admitted-artifact.json
          jq -e \
            --argjson id "$ADMITTED_ARTIFACT_ID" \
            --argjson run "$ADMITTED_RUN_ID" \
            --arg head "$ADMITTED_HEAD_SHA" \
            --arg digest "$ADMITTED_ARTIFACT_DIGEST" \
            '.id == $id and
             .name == "coverage-report" and
             .expired == false and
             .size_in_bytes > 0 and
             .size_in_bytes <= 134217728 and
             .digest == $digest and
             .workflow_run.id == $run and
             .workflow_run.head_sha == $head' admitted-artifact.json >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ADMITTED_ARTIFACT_ID/zip" \
            > admitted-coverage.zip
          actual_digest="$(sha256sum admitted-coverage.zip | awk '{print $1}')"
          test "sha256:$actual_digest" = "$ADMITTED_ARTIFACT_DIGEST"
          mkdir admitted-coverage
          unzip -q admitted-coverage.zip \
            coverage.txt coverage-admission.json \
            -d admitted-coverage
          test -f admitted-coverage/coverage.txt
          test ! -L admitted-coverage/coverage.txt
          test -f admitted-coverage/coverage-admission.json
          test ! -L admitted-coverage/coverage-admission.json
          test "$(wc -c < admitted-coverage/coverage-admission.json)" -le 4096
          test "$(wc -c < admitted-coverage/coverage.txt)" -le 67108864
          jq -e \
            --argjson run "$ADMITTED_RUN_ID" \
            --arg head "$ADMITTED_HEAD_SHA" \
            '.schema_version == 1 and
             .workflow_run_id == $run and
             .head_sha == $head and
             .coverage_kind == "full"' \
            admitted-coverage/coverage-admission.json >/dev/null
          test "$(head -n 1 admitted-coverage/coverage.txt)" = "mode: atomic"
          test "$(wc -l < admitted-coverage/coverage.txt)" -gt 1
          cp admitted-coverage/coverage.txt coverage-cache.txt
          VERIFY
          then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -f coverage-cache.txt
            echo "::warning::Admitted coverage artifact verification failed; recomputing the complete profile."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recompute admitted merge coverage profile
        if: needs.lint.outputs.admitted_merge == 'true' && steps.metadata-current-cache.outputs.cache-hit != 'true' && steps.admitted-coverage.outputs.valid != 'true'
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
        run: |
          set -euo pipefail
          ./scripts/ci/run-full-coverage.sh coverage-cache.txt
          test -s coverage-cache.txt
          test "$(head -n 1 coverage-cache.txt)" = "mode: atomic"

      - name: Restore exact predecessor coverage profile
        id: metadata-source-cache
        if: needs.lint.outputs.admitted_merge != 'true' && steps.metadata-current-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ env.COVERAGE_SOURCE_REF }}-go${{ steps.setup-go-metadata.outputs.go-version }}

      - name: Validate promoted predecessor coverage profile
        if: needs.lint.outputs.admitted_merge != 'true' && steps.metadata-current-cache.outputs.cache-hit != 'true' && steps.metadata-source-cache.outputs.cache-hit == 'true'
        run: |
          set -eu
          test -s coverage-cache.txt
          test "$(head -n 1 coverage-cache.txt)" = "mode: atomic"

      - name: Install archive tooling for cold metadata baseline
        if: needs.lint.outputs.admitted_merge != 'true' && steps.metadata-current-cache.outputs.cache-hit != 'true' && steps.metadata-source-cache.outputs.cache-hit != 'true'
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null; then
            echo "zip and unzip are already available"
          else
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Recompute cold metadata baseline
        if: needs.lint.outputs.admitted_merge != 'true' && steps.metadata-current-cache.outputs.cache-hit != 'true' && steps.metadata-source-cache.outputs.cache-hit != 'true'
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
        run: |
          set -euo pipefail
          ./scripts/ci/run-full-coverage.sh coverage-cache.txt
          test -s coverage-cache.txt
          test "$(head -n 1 coverage-cache.txt)" = "mode: atomic"

      - name: Save exact main SHA coverage profile
        if: steps.metadata-current-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ github.sha }}-go${{ steps.setup-go-metadata.outputs.go-version }}

      # actions/cache/save reports upload failures as warnings. Convert an
      # absent exact target key into a hard producer failure.
      - name: Verify metadata main SHA coverage cache exists
        id: metadata-target-cache-verification
        uses: actions/cache/restore@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ github.sha }}-go${{ steps.setup-go-metadata.outputs.go-version }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Require exact metadata main SHA coverage cache
        env:
          EXACT_CACHE_HIT: ${{ steps.metadata-target-cache-verification.outputs.cache-hit }}
        run: test "$EXACT_CACHE_HIT" = true

  coverage:
    name: Coverage
    needs:
      - lint
      - coverage-current
      - coverage-current-full
      - coverage-supporting
      - coverage-baseline
      - coverage-main-metadata
      - coverage-darwin
      - coverage-windows
    if: ${{ always() && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify coverage profile jobs
        env:
          CHANGELOG_ONLY: ${{ needs.lint.outputs.changelog_only }}
          DOCS_ONLY: ${{ needs.lint.outputs.docs_only }}
          ADMITTED_MERGE: ${{ needs.lint.outputs.admitted_merge }}
          FULL_SUITE: ${{ needs.lint.outputs.full_suite }}
          PLATFORM_SENSITIVE: ${{ needs.lint.outputs.platform_sensitive }}
          CURRENT_RESULT: ${{ needs.coverage-current.result }}
          CURRENT_FULL_RESULT: ${{ needs.coverage-current-full.result }}
          SUPPORTING_RESULT: ${{ needs.coverage-supporting.result }}
          BASELINE_RESULT: ${{ needs.coverage-baseline.result }}
          MAIN_METADATA_RESULT: ${{ needs.coverage-main-metadata.result }}
          DARWIN_RESULT: ${{ needs.coverage-darwin.result }}
          WINDOWS_RESULT: ${{ needs.coverage-windows.result }}
        run: |
          failed=0
          current_expected=success
          current_full_expected=skipped
          supporting_expected=skipped
          baseline_expected=success
          main_metadata_expected=skipped
          native_expected=skipped
          if [ "$ADMITTED_MERGE" = true ]; then
            current_expected=skipped
            baseline_expected=skipped
            main_metadata_expected=success
          elif [ "$CHANGELOG_ONLY" = true ] || [ "$DOCS_ONLY" = true ]; then
            current_expected=skipped
            baseline_expected=skipped
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              main_metadata_expected=success
            fi
          elif [ "$FULL_SUITE" = true ]; then
            current_expected=skipped
            current_full_expected=success
            supporting_expected=success
          fi
          if [ "$CHANGELOG_ONLY" != true ] &&
             [ "$DOCS_ONLY" != true ] &&
             [ "$PLATFORM_SENSITIVE" = true ]; then
            native_expected=success
          fi

          for profile in \
            "current:$CURRENT_RESULT:$current_expected" \
            "current shards:$CURRENT_FULL_RESULT:$current_full_expected" \
            "supporting:$SUPPORTING_RESULT:$supporting_expected" \
            "baseline:$BASELINE_RESULT:$baseline_expected" \
            "main metadata cache:$MAIN_METADATA_RESULT:$main_metadata_expected"
          do
            name="${profile%%:*}"
            remainder="${profile#*:}"
            result="${remainder%%:*}"
            expected="${remainder#*:}"
            printf '%s: %s (expected %s)\n' "$name" "$result" "$expected"
            if [ "$result" != "$expected" ]; then
              failed=1
            fi
          done

          for native in \
            "macOS native:$DARWIN_RESULT" \
            "Windows native:$WINDOWS_RESULT"
          do
            name="${native%%:*}"
            result="${native#*:}"
            printf '%s: %s (expected %s)\n' \
              "$name" "$result" "$native_expected"
            if [ "$result" != "$native_expected" ]; then
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Check out repository
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        id: setup-go
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve authoritative coverage base
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          echo "COVERAGE_BASE_REF=$base_ref" >> "$GITHUB_ENV"

      - name: Download current coverage profiles
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-current-*
          merge-multiple: true
          path: .

      - name: Download supporting coverage profiles
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true' && needs.lint.outputs.full_suite == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-supporting-profiles
          path: .

      - name: Download baseline coverage profile
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline-profile
          path: .

      # Each package belongs to one shard, while internal/app test partitions
      # are balanced across the same five jobs. Union duplicate app source
      # blocks by their greatest atomic count. Every expected shard must be
      # present; a missing shard would silently shrink the comparison.
      - name: Assemble full-suite coverage profile
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true' && needs.lint.outputs.full_suite == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -f coverage.txt
          profiles=()
          for shard in app cli generators helpers remaining; do
            profile="coverage-shard-$shard.txt"
            test -f "$profile"
            test "$(head -n 1 "$profile")" = "mode: atomic"
            profiles+=("$profile")
          done
          ./scripts/ci/merge-coverage-profiles.sh coverage.txt "${profiles[@]}"

      - name: Enforce coverage gate
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        env:
          FULL_SUITE: ${{ needs.lint.outputs.full_suite }}
          COVERAGE_TARGET: "100"
          COVERAGE_ENFORCE_OVERALL: "false"
          COVERAGE_OVERALL_TOLERANCE: "0.1"
        run: |
          policy_profile=coverage-policy.txt
          if [ "$FULL_SUITE" != true ]; then
            policy_profile=
          fi
          additional_profile=
          if [ -f coverage-shortcut.txt ]; then
            additional_profile=coverage-shortcut.txt
          fi
          COVERAGE_DIFF_PROFILE="$policy_profile" \
          COVERAGE_ADDITIONAL_DIFF_PROFILE="$additional_profile" \
            make coverage-gate BASE_REF="$COVERAGE_BASE_REF"

      # Publish this push's full-suite profile as the merge-base cache for
      # future PRs whose merge-base is exactly this commit. Saved only after
      # the gate passed so a broken run never becomes a baseline. Both producer
      # and consumer use coverage-cache.txt because the cache version includes
      # the configured path as well as the compression tool.
      - name: Prepare push coverage profile as merge-base cache
        if: github.event_name == 'push' && needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true'
        run: |
          set -eu
          test -s coverage.txt
          test "$(head -n 1 coverage.txt)" = "mode: atomic"
          cp coverage.txt coverage-cache.txt

      - name: Save push coverage profile as merge-base cache
        if: github.event_name == 'push' && needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true'
        uses: actions/cache/save@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ github.sha }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Verify push coverage cache exists
        id: push-cache-verification
        if: github.event_name == 'push' && needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true'
        uses: actions/cache/restore@v4
        with:
          path: coverage-cache.txt
          key: dws-coverage-full-v2-${{ github.sha }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Require exact push coverage cache
        if: github.event_name == 'push' && needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.full_suite == 'true'
        env:
          EXACT_CACHE_HIT: ${{ steps.push-cache-verification.outputs.cache-hit }}
        run: test "$EXACT_CACHE_HIT" = true

      - name: Generate coverage report
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        run: |
          if [ "$(wc -l < coverage.txt)" -gt 1 ]; then
            go tool cover -html=coverage.txt -o coverage.html
          else
            echo "No buildable Go package needed a coverage HTML report." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record coverage admission metadata
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        shell: bash
        env:
          COVERAGE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          COVERAGE_RUN_ID: ${{ github.run_id }}
          FULL_SUITE: ${{ needs.lint.outputs.full_suite }}
        run: |
          set -euo pipefail
          full_commit='^[0-9a-f]{40}$'
          positive_integer='^[1-9][0-9]*$'
          [[ "$COVERAGE_HEAD_SHA" =~ $full_commit ]]
          [[ "$COVERAGE_RUN_ID" =~ $positive_integer ]]
          case "$FULL_SUITE" in
            true) coverage_kind=full ;;
            false) coverage_kind=scoped ;;
            *) echo "Unknown coverage suite kind: $FULL_SUITE" >&2; exit 1 ;;
          esac
          jq -n \
            --argjson run "$COVERAGE_RUN_ID" \
            --arg head "$COVERAGE_HEAD_SHA" \
            --arg kind "$coverage_kind" \
            '{
              schema_version: 1,
              workflow_run_id: $run,
              head_sha: $head,
              coverage_kind: $kind
            }' > coverage-admission.json

      - name: Upload coverage artifact
        if: needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage-base.txt
            coverage-policy.txt
            coverage-shortcut.txt
            coverage.html
            coverage-admission.json
          if-no-files-found: error

  policy:
    name: Policy
    needs: lint
    runs-on: ubuntu-latest
    # Full policy regenerates and validates the runtime Schema several times.
    # Keep job-level headroom for large reviewed command-surface additions;
    # individual policy gates retain their own fail-closed checks.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: needs.lint.outputs.admitted_merge != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify pull request merge revision
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA" || {
            echo "checked-out merge first parent does not match event base" >&2
            exit 1
          }
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" || {
            echo "checked-out merge second parent does not match event head" >&2
            exit 1
          }

      - name: Validate changed CHANGELOG content
        if: github.event_name == 'pull_request'
        env:
          CLASSIFIED_CHANGELOG_CHANGED: ${{ needs.lint.outputs.changelog_changed }}
          CHANGELOG_ONLY: ${{ needs.lint.outputs.changelog_only }}
          RELEASE_SEAL_ONLY: ${{ needs.lint.outputs.release_seal_only }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          merge_changelog_changed=false
          if git diff --no-ext-diff --find-renames --name-status \
            "$PR_BASE_SHA" HEAD |
            awk -F '\t' '
              {
                for (field = 2; field <= NF; field++) {
                  if ($field == "CHANGELOG.md") found = 1
                }
              }
              END { exit !found }
            '
          then
            merge_changelog_changed=true
          fi
          test "$merge_changelog_changed" = "$CLASSIFIED_CHANGELOG_CHANGED" || {
            echo "Files API and synthetic merge tree disagree on CHANGELOG scope" >&2
            exit 1
          }
          if [ "$merge_changelog_changed" != true ]; then
            exit 0
          fi

          mode=--content-only
          if [ "$CHANGELOG_ONLY" = true ] && [ "$RELEASE_SEAL_ONLY" != true ]; then
            mode=--fast-path
          fi
          ./scripts/policy/check-changelog-pr.sh \
            "$mode" "$PR_BASE_SHA" HEAD

      - name: Validate release fragment lifecycle
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/policy/check-release-fragments.sh "$PR_BASE_SHA" HEAD

      - name: Validate trusted main metadata-only push
        if: github.event_name == 'push' && needs.lint.outputs.changelog_only == 'true'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          RELEASE_SEAL_ONLY: ${{ needs.lint.outputs.release_seal_only }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$PUSH_AFTER_SHA" || {
            echo "checked-out push revision does not match event after SHA" >&2
            exit 1
          }
          mode=--fast-path
          if [ "$RELEASE_SEAL_ONLY" = true ]; then
            mode=--content-only
          fi
          ./scripts/policy/check-changelog-pr.sh \
            "$mode" "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
          if [ "$RELEASE_SEAL_ONLY" = true ]; then
            ./scripts/policy/check-release-fragments.sh \
              "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
          fi

      - name: Record CHANGELOG-only fast path
        if: needs.lint.outputs.changelog_only == 'true'
        env:
          RELEASE_SEAL_ONLY: ${{ needs.lint.outputs.release_seal_only }}
        run: |
          if [ "$RELEASE_SEAL_ONLY" = true ]; then
            echo "Only the trusted release-seal and fragment validators ran; executable sources are unchanged." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Only the trusted base-equivalent CHANGELOG validator ran; executable sources are unchanged." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record admitted-merge reuse
        if: needs.lint.outputs.admitted_merge == 'true'
        env:
          ADMITTED_HEAD_SHA: ${{ needs.lint.outputs.admitted_merge_head_sha }}
          ADMITTED_RUN_ID: ${{ needs.lint.outputs.admitted_merge_run_id }}
        run: |
          echo "Policy reuses successful Code Admission from PR head $ADMITTED_HEAD_SHA (CI run $ADMITTED_RUN_ID)." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Validate scoped policy
        if: ${{ needs.lint.outputs.admitted_merge != 'true' && needs.lint.outputs.changelog_only != 'true' && (needs.lint.outputs.docs_only == 'true' || (needs.lint.outputs.full_suite != 'true' && needs.lint.outputs.interface_sensitive != 'true')) }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$PR_BASE_SHA"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          git diff --check "$base_ref" HEAD
          ./scripts/policy/check-open-source-assets.sh
          echo "Policy used the scoped content/source admission path." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        run: make build

      - name: Policy
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        run: make policy

  interface-integrity:
    name: Interface Integrity
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        run: make build

      - name: Resolve authoritative compatibility merge-base
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          candidate_ref="$(git rev-parse 'HEAD^{commit}')"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$candidate_ref" != "$PR_HEAD_SHA" ]; then
            echo "Compatibility checkout $candidate_ref does not match PR head $PR_HEAD_SHA" >&2
            exit 1
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          . ./scripts/release/release-lib.sh
          stable_ref=""
          for tag in $(git tag --merged "$base_ref" --list 'v*' --sort=-version:refname); do
            release_is_stable_version "$tag" || continue
            if git rev-parse --verify --quiet "refs/tags/withdrawn/$tag" >/dev/null; then
              continue
            fi
            stable_ref="$tag"
            break
          done
          if [ -z "$stable_ref" ]; then
            echo "No stable release tag is reachable from compatibility base $base_ref" >&2
            exit 1
          fi
          git rev-parse --verify "${stable_ref}^{commit}" >/dev/null
          printf '%s\n' \
            "COMPATIBILITY_BASE_REF=$base_ref" \
            "COMPATIBILITY_STABLE_REF=$stable_ref" \
            "COMPATIBILITY_CANDIDATE_REF=$candidate_ref" >> "$GITHUB_ENV"

      - name: Check historical commands, help, and complete CLI compatibility
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        run: |
          make authoritative-interface-integrity \
            BASE_REF="$COMPATIBILITY_BASE_REF" \
            STABLE_REF="$COMPATIBILITY_STABLE_REF" \
            CANDIDATE_REF="$COMPATIBILITY_CANDIDATE_REF"

      - name: Check complete Schema compatibility
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        run: |
          make schema-compatibility \
            BASE_REF="$COMPATIBILITY_BASE_REF" \
            STABLE_REF="$COMPATIBILITY_STABLE_REF" \
            CANDIDATE_REF="$COMPATIBILITY_CANDIDATE_REF"

      - name: Check skill command references
        if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && (needs.lint.outputs.full_suite == 'true' || needs.lint.outputs.interface_sensitive == 'true') }}
        run: make skill-command-integrity

      - name: Record admitted-merge reuse
        if: needs.lint.outputs.admitted_merge == 'true'
        env:
          ADMITTED_HEAD_SHA: ${{ needs.lint.outputs.admitted_merge_head_sha }}
          ADMITTED_RUN_ID: ${{ needs.lint.outputs.admitted_merge_run_id }}
        run: |
          echo "Interface Integrity reuses successful Code Admission from PR head $ADMITTED_HEAD_SHA (CI run $ADMITTED_RUN_ID)." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Record scoped fast path
        if: ${{ needs.lint.outputs.admitted_merge != 'true' && (needs.lint.outputs.changelog_only == 'true' || needs.lint.outputs.docs_only == 'true' || (needs.lint.outputs.full_suite != 'true' && needs.lint.outputs.interface_sensitive != 'true')) }}
        run: echo "Interface Integrity is unaffected by this classified revision." >> "$GITHUB_STEP_SUMMARY"

