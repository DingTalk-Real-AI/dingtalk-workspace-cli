name: Build and publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        env:
          VERSION: 0.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}
        run: ./scripts/dev/build-all.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          # GoReleaser also leaves build directories and metadata in dist/.
          # Publish only the distributable archives and their checksum file.
          gh release create "$RELEASE_TAG" dist/dws-*.tar.gz dist/dws-*.zip dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "DWS build #${{ github.run_number }}.${{ github.run_attempt }}" \
            --notes "Built from $GITHUB_REPOSITORY@$GITHUB_SHA by the manual Build and publish Release workflow." \
            --prerelease
