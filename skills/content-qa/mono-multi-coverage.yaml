# Mono↔multi content QA contract (machine-readable).
# Spec: docs/skill-mono-multi-qa.md
# schema_version bumps only when field semantics change.

schema_version: 1

# Every top-level stem under skills/mono/references/products must appear
# in coverage or omit_coverage (file stem without .md, or directory name).
# Duplicate stems (chat.md + chat/ dir) share one row.

coverage:
  - mono: aisearch
    multi_skill: dingtalk-aisearch
  - mono: aitable
    multi_skill: dingtalk-aitable
    multi_refs:
      - references/aitable.md
  - mono: aitable-record-ops
    multi_skill: dingtalk-aitable
  - mono: calendar
    multi_skill: dingtalk-calendar
  - mono: chat
    multi_skill: dingtalk-chat
    multi_refs:
      - references/chat.md
  - mono: chat-emoji-list
    multi_skill: dingtalk-chat
    multi_refs:
      - references/chat-emoji-list.md
  - mono: contact
    multi_skill: dingtalk-contact
  - mono: dev
    multi_skill: dingtalk-misc
    multi_refs:
      - references/devapp.md
  - mono: doc
    multi_skill: dingtalk-doc
    multi_refs:
      - references/doc.md
  - mono: drive
    multi_skill: dingtalk-drive
  - mono: event
    multi_skill: dingtalk-event
    multi_refs:
      - references/event-im.md
      - references/event-oa.md
  - mono: hrbrain
    multi_skill: dingtalk-misc
    multi_refs:
      - references/hrbrain.md
  - mono: mail
    multi_skill: dingtalk-mail
  - mono: markdown
    multi_skill: dingtalk-misc
    multi_refs:
      - references/markdown.md
  - mono: minutes
    multi_skill: dingtalk-minutes
  - mono: pat
    multi_skill: dingtalk-misc
    multi_refs:
      - references/pat.md
  - mono: todo
    multi_skill: dingtalk-todo
  - mono: wiki
    multi_skill: dingtalk-wiki
  - mono: agoal
    multi_skill: dingtalk-misc
    multi_refs:
      - references/agoal.md
  - mono: attendance
    multi_skill: dingtalk-misc
    multi_refs:
      - references/attendance.md
  - mono: attendance-report
    multi_skill: dingtalk-misc
    multi_refs:
      - references/attendance-report.md
  - mono: attendance-schedule
    multi_skill: dingtalk-misc
    multi_refs:
      - references/attendance-schedule.md
  - mono: attendance-vacation
    multi_skill: dingtalk-misc
    multi_refs:
      - references/attendance-vacation.md
  - mono: ding
    multi_skill: dingtalk-misc
    multi_refs:
      - references/ding.md
  - mono: devdoc
    multi_skill: dingtalk-misc
    multi_refs:
      - references/devdoc.md
  - mono: oa
