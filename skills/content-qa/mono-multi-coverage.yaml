    multi_skill: dingtalk-misc
    multi_refs:
      - references/report.md
  - mono: sheet
    multi_skill: dingtalk-misc
    multi_refs:
      - references/sheet.md
  - mono: whiteboard
    multi_skill: dingtalk-misc
    multi_refs:
      - references/whiteboard.md
  - mono: recruit
    multi_skill: dingtalk-misc
    multi_refs:
      - references/recruit.md

omit_coverage:
  - mono: simple
    disposition: covered_by
    via: dingtalk-misc
    reason: "mono simple.md 为 oa/devdoc 合集；已拆入 dingtalk-misc references/oa.md 与 devdoc.md"

# Global protocol files: multi path must exist unless omit_global.
global_protocols:
  - id: error-codes
    multi_path: dingtalk-shared/references/error-codes.md
  - id: url-patterns
    multi_path: dingtalk-shared/references/url-patterns.md
  - id: capability-limits
    multi_path: dingtalk-shared/references/capability-limits.md
  - id: channel-login
    multi_path: dingtalk-shared/references/channel-login.md
  - id: global-reference
    multi_path: dingtalk-shared/references/global-reference.md
  - id: intent-guide
    multi_path: dingtalk-shared/references/intent-guide.md
  - id: runtime-contract
    multi_path: dingtalk-shared/references/runtime-contract.md
  - id: confirmation-protocol
    multi_path: dingtalk-shared/references/confirmation.md
  - id: schema-usage
    multi_path: dingtalk-shared/references/schema-usage.md

omit_global:
  - id: field-rules-global
    mono_path: references/field-rules.md
    expected_multi: dingtalk-aitable/references/field-rules.md
    disposition: covered_by
    reason: "AI 表格字段规则已下沉到 dingtalk-aitable；G3/coverage 不强制全局同名"

# Reviewed file pairs. Most are byte-identical; layout-only link differences
# must be declared as data-driven substitutions.
paired_files:
  - mono: scripts/report_received_today.py
    multi: dingtalk-misc/scripts/report_received_today.py
    mode: identical
  - mono: scripts/minutes_recent_summary.py
    multi: dingtalk-minutes/scripts/minutes_recent_summary.py
    mode: identical
  - mono: references/products/sheet.md
    multi: dingtalk-misc/references/sheet.md
    mode: link-normalized
    link_substitutions:
      - mono: "../url-patterns.md"
        multi: "../../dingtalk-shared/references/url-patterns.md"
      - mono: "../intent-guide.md"
        multi: "sheet-intent-guide.md"
  - mono: references/products/whiteboard/compose.md
    multi: dingtalk-misc/references/whiteboard/compose.md
    mode: identical
  - mono: references/products/whiteboard/vector.md
    multi: dingtalk-misc/references/whiteboard/vector.md
    mode: identical
  - mono: references/products/whiteboard/replace.md
    multi: dingtalk-misc/references/whiteboard/replace.md
    mode: identical

# Directory pairs whose relative file sets and contents must stay byte-identical.
paired_trees:
  - mono: references/products/sheet
    multi: dingtalk-misc/references/sheet
    mode: identical

# Production scripts under skills/multi/*/scripts not referenced by any .md in
# that skill tree. Python test_*.py and *_test.py files are not Agent content.
# yida/finance/aiapp are referenced via dingtalk-misc/references/unsupported-scripts.md
orphan_scripts_allowlist:
  - path: dingtalk-aitable/scripts/aitable_import_via_task.py
    disposition: defer
    reason: "helper referenced indirectly / pending doc"

# Exact repository-relative paths retired from Skill delivery. Reintroducing
# any path is a content-contract failure, even if a Markdown page links it.
retired_scripts:
  - path: skills/multi/dingtalk-minutes/scripts/minutes_extract_todos.py
    reason: "action-items and detail shortcuts replace the duplicate workflow"
  - path: skills/multi/dingtalk-minutes/scripts/minutes_list_parse.py
    reason: "the retained Markdown summary script owns its small parser"
  - path: skills/mono/scripts/minutes_extract_todos.py
    reason: "action-items and detail shortcuts replace the duplicate workflow"
  - path: skills/mono/scripts/minutes_list_parse.py
    reason: "the retained Markdown summary script owns its small parser"

# Skills allowed to omit references/ directory.
skills_without_references_allowlist: []
